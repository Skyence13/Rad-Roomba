  - {pin: PE15,  lqfp100: 46, signal: "IMON_CH",       peripheral: ADC4,   af: "-",dir: analog, note: "Per-chain anode current monitor: V(TRIMDRV) of the chain selected by MON_MUX_A[2:0] through U2703 (TMUX1108), 10 k R108 + 100 nF C2704 (1 ms), unity buffer U2306B, 1 k R2701 + 10 nF C2705. I = (V_trim - V) / 4.99 k (R105). 147 nA per LSB at 3.0 V.", channel: 2}
  - {pin: PC12,  lqfp100: 81, signal: "LED_STROBE",    peripheral: TIM8,   af: 4,  dir: out,    note: "TIM8_CH3N: strobe of the LED pulser (BSS138 Q1001/1101/1201/1301 via 100 R each), all four lanes together; amplitude V_LED = 2 x U_DAC0 output 7. Idle low, 100 k ext PD (R2413). Pulse ~200 ns: held high it feeds the LED through R1018 (10 k) continuously."}
  - {pin: PF1,   lqfp100: 13, signal: "SYNC_IN",       peripheral: GPIO,   af: "-",dir: in,     note: "RESERVED hardware time-pulse input (J2 pins 5/6 via the DNP ISO7710 U2503). Not used by firmware 0.5; configured as an input with the board's 100 k pull-down (R2414). Usable as GPIO only because HSE runs in bypass mode."}
  - {pin: PF2,   lqfp100: 19, signal: "PULSER_A0",     peripheral: GPIO,   af: "-",dir: out,    note: "Test-pulse channel select bit 0 (74LVC138 U2702 A0): pulsed chain = PULSER_A[2:0], 0-3 = F0-F3, 4-7 = R0-R3. 100 k ext PD (default F0)."}
  - {pin: PF9,   lqfp100: 10, signal: "PULSER_A1",     peripheral: GPIO,   af: "-",dir: out,    note: "Test-pulse channel select bit 1. 100 k ext PD."}
  - {pin: PF10,  lqfp100: 11, signal: "PULSER_A2",     peripheral: GPIO,   af: "-",dir: out,    note: "Test-pulse channel select bit 2. 100 k ext PD."}

# DAC output allocation. The `outputs` lists are compared with electronics/head_acq/design/circuit.py DAC_MAP by
# its self-check, which spells the two former spare outputs "SPARE": do not rename them here. Their board functions are
# in `board_functions` below (circuit.py: U_DAC0 OUT7 = LED_AMPL, U_DAC1 OUT7 = DAC1_SPARE test pad). (firmware/head/hal/rrh_hal.h uses the same order). DAC60508: 12-bit, 8 outputs.
dac_map:
  U_DAC0: {cs: DAC_CS0_N, outputs: [BETA_LLD_0, BETA_ULD_0, ALPHA_0, BETA_LLD_1, BETA_ULD_1, ALPHA_1, HV_SET, SPARE]}
  U_DAC1: {cs: DAC_CS1_N, outputs: [BETA_LLD_2, BETA_ULD_2, ALPHA_2, BETA_LLD_3, BETA_ULD_3, ALPHA_3, PULSER_AMPL, SPARE]}
  U_DAC2: {cs: DAC_CS2_N, outputs: [REF_LLD_0, REF_ULD_0, REF_LLD_1, REF_ULD_1, REF_LLD_2, REF_ULD_2, REF_LLD_3, REF_ULD_3]}
  U_DAC3: {cs: DAC_CS3_N, outputs: [TRIM_FLOOR_0, TRIM_FLOOR_1, TRIM_FLOOR_2, TRIM_FLOOR_3, TRIM_REF_0, TRIM_REF_1, TRIM_REF_2, TRIM_REF_3]}
board_functions:
  U_DAC0: {7: "LED_AMPL (V_LED = 2 x V(LED_AMPL) through U2306A, R2313/R2314; 0 ... 5.0 V)"}
  U_DAC1: {7: "DAC1_SPARE (test pad TP only; not driven by firmware)"}
unused_pins: []
event_capture_notes:
  - "BUSY must be the latch output itself (not a gated copy): its rising edge is the hardware-captured event start; it falls only when the MCU pulses CLR."
  - "CLR is level-sensitive active low on the latch asynchronous clear. While CLR is low the chain is blind; the firmware reads the timer immediately before the pulse and accounts the event as busy up to that reading plus a fixed, measured allowance for the pulse (RRH_EVT_CLR_TICKS)."
  - "The LLD comparator outputs (LLD_Fn / LLD_Rn) are needed because an edge-triggered BUSY latch cleared while its comparator is still high would not see the next rising edge: firmware waits for low, bounded by the maximum hold (then flags the chain saturated and clears anyway)."
  - "All eight BUSY inputs have a hardware timestamp; nothing in the event path depends on interrupt latency except the dead time per event, which is measured."
nucleo_g474re_bringup:
  note: "A NUCLEO-G474RE (LQFP64) can run the link, core and housekeeping for bring-up with -DRRH_BOARD_NUCLEO (HSE crystal instead of bypass). Ports D and E do not exist on that package, so event capture is limited to the BUSY inputs (latch read-backs read as zero = beta/ref class) and the debug console needs a USB-UART on PC10/PC11. Nucleo wiring is recalled, UNVERIFIED."
