# RR-HEAD-ACQ head MCU pin map PROPOSAL (firmware -> electronics). Owner: head firmware lead.
# MCU: STM32G474VET6, LQFP100 (DEC-037: no FPGA; event capture by MCU timers + discrete latches).
# Source of truth for firmware/head/port/stm32g474/rrh_pins.h and the hardware mapping table in
# firmware/head/README.md (both generated by tools/gen_pinmap.py).
#
# Evidence: every pin number and every alternate-function / ADC-channel assignment below was
# checked by tools/check_pinmap.py against ST's machine-readable pin database
# (STMicroelectronics/STM32_open_pin_data: mcu/STM32G474V(B-C-E)Tx.xml and
# mcu/IP/GPIO-STM32G47x_gpio_v1_0_Modes.xml, fetched 2026-11-26) -> class "tool-checked".
# Not checked against the datasheet PDF (st.com unreachable from the build host). Items recalled
# from memory only carry the word UNVERIFIED in their note.
#
# Conventions: dir is seen from the MCU (in/out/bidir/analog/power). af "-" = GPIO, analog or a
# dedicated function. All logic is 3.3 V. "ext PD"/"ext PU" = external resistor required so the
# pin has a safe level while the MCU is in reset. Chains: F0..F3 = floor lanes 0..3,
# R0..R3 = reference lanes 0..3 (chain index 0..7 in firmware = F0..F3, R0..R3).
mcu: STM32G474VET6
package: LQFP100
clock:
  source: "24 MHz TCXO (CMOS or clipped sine through a squarer) into PF0-OSC_IN, HSE bypass"
  sysclk_hz: 144000000
  pll: "HSE 24 MHz / M=2 -> 12 MHz, x N=24 -> 288 MHz VCO, /R=2 -> 144 MHz SYSCLK = timer clock, /Q=6 -> 48 MHz (RNG)"
  note: "144 MHz stays in voltage range 1 normal mode (<= 150 MHz) with 4 flash wait states (table UNVERIFIED against RM0440). 144 ticks per microsecond and 1 Mbaud (BRR = 144) divide exactly."
peripherals:
  TIM2:    "32-bit, 144 MHz, free running = head clock (extended to 64 bit in software). CH1..CH4 input capture = BUSY of floor chains F0..F3: event start time captured in hardware."
  TIM5:    "32-bit, 144 MHz, free running. CH1..CH4 input capture = BUSY of reference chains R0..R3. Offset to TIM2 measured once at start-up."
  TIM6:    "100 kHz event-capture service interrupt (classify, read clear time, pulse CLR, gate boundaries, heater switching, scheduled reply start)"
  TIM4:    "16-bit, 144 MHz, free running. CH1..CH4 input capture (falling edge) of the RAW BETA_LLD comparator outputs F0..F3: pulse width (time over threshold) = falling capture - BUSY start. Offset to TIM2 measured once."
  TIM3:    "16-bit, 144 MHz, free running. CH1..CH4 input capture of the RAW REF_LLD comparator outputs R0..R3 (as TIM4)."
  TIM8:    "48 MHz (SYSCLK / 3), 1 kHz period. CH1 (PC6) = charge-injection test-pulser strobe, width 1..100 us; CH3N (PC12) = LED-pulser strobe LED_STROBE, ~200 ns (UNVERIFIED: the LED and its optical coupling are not chosen). Which chain is pulsed: PULSER_A[2:0] on PF2/PF9/PF10 (GPIO). (Pseudo-random strobing by reloading the period is not implemented.)"
  USART1:  "RS-485 host link, 1 Mbaud 8N1, hardware driver-enable (DEM) on USART1_DE"
  UART4:   "debug console 115200 8N1"
  SPI1:    "threshold/trim DACs, 4 x DAC60508, mode 1, 4.5 MHz, one GPIO chip-select each"
  I2C3:    "TMP117 x2 (0x48, 0x49), 24AA025E64 EUI EEPROM (0x50) and the OPTIONAL TCA9534 expander (0x20: MON_EXT out, MON_LANE_EN out (P7, stage 3: lane monitor muxes off), HV_PERMIT / HV_INH_N / LID_G / EF_FLT_N / HWREV in), 100 kHz"
  ADC1:    "housekeeping scan: bias V/I, 4 SiPM NTC, heater NTC, board NTC, supply, heater sense"
  ADC2:    "monitor waveform capture (engineering), stopped after the selected chain's BUSY capture (not implemented in the target port)"
  ADC4:    "IMON_CH: per-chain anode current monitor on PE15 = ADC4_IN2, background scan of the eight chains through the TMUX1108 U2703 addressed by MON_MUX_A[2:0] (settle 10 ms per step)"
  IWDG:    "independent watchdog (LSI), ~1 s"
  RNG:     "TRNG for the boot UUID (48 MHz from PLLQ)"
pins:
  - {pin: VBAT,  lqfp100: 6,  signal: "VBAT",          peripheral: power,  af: "-",dir: power,  note: "Tie to +3V3 (no backup domain use)."}
  - {pin: VSS,   lqfp100: 23, signal: "GND",           peripheral: power,  af: "-",dir: power,  note: "Also pins 48, 63, 74, 99."}
  - {pin: VDD,   lqfp100: 24, signal: "+3V3",          peripheral: power,  af: "-",dir: power,  note: "Also pins 49, 64, 75, 100. 100 nF each + 4.7 uF bulk."}
  - {pin: VSSA,  lqfp100: 35, signal: "AGND",          peripheral: power,  af: "-",dir: power,  note: "Star point to GND at the MCU."}
  - {pin: VREF+, lqfp100: 36, signal: "VREF_ADC",      peripheral: power,  af: "-",dir: power,  note: "External 3.0 V reference preferred; else VDDA through 0 R. 1 uF + 100 nF."}
  - {pin: VDDA,  lqfp100: 37, signal: "+3V3A",         peripheral: power,  af: "-",dir: power,  note: "Filtered from +3V3 (ferrite + 1 uF + 10 nF)."}
  - {pin: PG10,  lqfp100: 14, signal: "NRST",          peripheral: SYS,    af: "-",dir: bidir,  note: "100 nF to GND, to SWD header pin 10. No other driver."}
  - {pin: PB8,   lqfp100: 95, signal: "BOOT0",         peripheral: SYS,    af: "-",dir: in,     note: "10 k ext PD + test point / jumper to +3V3 for the ROM bootloader. Not used as GPIO."}
  - {pin: PF0,   lqfp100: 12, signal: "HSE_IN_24M",    peripheral: RCC,    af: "-",dir: in,     note: "RCC_OSC_IN, HSE bypass, from the 24 MHz TCXO."}
  - {pin: PA13,  lqfp100: 76, signal: "SWDIO",         peripheral: SYS,    af: 0,  dir: bidir,  note: "SWD header (ARM 10-pin 1.27 mm / TC2030)."}
  - {pin: PA14,  lqfp100: 77, signal: "SWCLK",         peripheral: SYS,    af: 0,  dir: in,     note: "SWD header."}
  - {pin: PA15,  lqfp100: 78, signal: "BUSY_F0",       peripheral: TIM2,   af: 1,  dir: in,     note: "TIM2_CH1 input capture, rising edge. Q of the BETA_LLD (BUSY) latch of floor lane 0. 100 k ext PD so a missing latch supply reads idle. PA15 is JTDI with a pull-up at reset: harmless for an input."}
  - {pin: PB3,   lqfp100: 90, signal: "BUSY_F1",       peripheral: TIM2,   af: 1,  dir: in,     note: "TIM2_CH2 input capture, rising edge. Q of the BETA_LLD (BUSY) latch of floor lane 1. 100 k ext PD so a missing latch supply reads idle. PB3 is the only SWO pin: trace is given up."}
  - {pin: PB10,  lqfp100: 47, signal: "BUSY_F2",       peripheral: TIM2,   af: 1,  dir: in,     note: "TIM2_CH3 input capture, rising edge. Q of the BETA_LLD (BUSY) latch of floor lane 2. 100 k ext PD so a missing latch supply reads idle."}
  - {pin: PB11,  lqfp100: 50, signal: "BUSY_F3",       peripheral: TIM2,   af: 1,  dir: in,     note: "TIM2_CH4 input capture, rising edge. Q of the BETA_LLD (BUSY) latch of floor lane 3. 100 k ext PD so a missing latch supply reads idle."}
  - {pin: PA0,   lqfp100: 20, signal: "BUSY_R0",       peripheral: TIM5,   af: 2,  dir: in,     note: "TIM5_CH1 input capture, rising edge. Q of the REF_LLD (BUSY) latch of reference lane 0. 100 k ext PD."}
  - {pin: PA1,   lqfp100: 21, signal: "BUSY_R1",       peripheral: TIM5,   af: 2,  dir: in,     note: "TIM5_CH2 input capture, rising edge. Q of the REF_LLD (BUSY) latch of reference lane 1. 100 k ext PD."}
  - {pin: PE8,   lqfp100: 39, signal: "BUSY_R2",       peripheral: TIM5,   af: 1,  dir: in,     note: "TIM5_CH3 input capture, rising edge. Q of the REF_LLD (BUSY) latch of reference lane 2. 100 k ext PD."}
  - {pin: PE9,   lqfp100: 40, signal: "BUSY_R3",       peripheral: TIM5,   af: 1,  dir: in,     note: "TIM5_CH4 input capture, rising edge. Q of the REF_LLD (BUSY) latch of reference lane 3. 100 k ext PD."}
  - {pin: PD0,   lqfp100: 82, signal: "ULD_F0",        peripheral: GPIO,   af: "-",dir: in,     note: "BETA_ULD latch Q, floor lane 0. All 16 PD inputs are read with one GPIOD->IDR access in the service interrupt; 100 k ext PD each."}
  - {pin: PD1,   lqfp100: 83, signal: "ULD_F1",        peripheral: GPIO,   af: "-",dir: in,     note: "BETA_ULD latch Q, floor lane 1. All 16 PD inputs are read with one GPIOD->IDR access in the service interrupt; 100 k ext PD each."}
  - {pin: PD2,   lqfp100: 84, signal: "ULD_F2",        peripheral: GPIO,   af: "-",dir: in,     note: "BETA_ULD latch Q, floor lane 2. All 16 PD inputs are read with one GPIOD->IDR access in the service interrupt; 100 k ext PD each."}
  - {pin: PD3,   lqfp100: 85, signal: "ULD_F3",        peripheral: GPIO,   af: "-",dir: in,     note: "BETA_ULD latch Q, floor lane 3. All 16 PD inputs are read with one GPIOD->IDR access in the service interrupt; 100 k ext PD each."}
  - {pin: PD4,   lqfp100: 86, signal: "ALPHA_F0",      peripheral: GPIO,   af: "-",dir: in,     note: "ALPHA (slow path) latch Q, floor lane 0."}
  - {pin: PD5,   lqfp100: 87, signal: "ALPHA_F1",      peripheral: GPIO,   af: "-",dir: in,     note: "ALPHA (slow path) latch Q, floor lane 1."}
  - {pin: PD6,   lqfp100: 88, signal: "ALPHA_F2",      peripheral: GPIO,   af: "-",dir: in,     note: "ALPHA (slow path) latch Q, floor lane 2."}
  - {pin: PD7,   lqfp100: 89, signal: "ALPHA_F3",      peripheral: GPIO,   af: "-",dir: in,     note: "ALPHA (slow path) latch Q, floor lane 3."}
  - {pin: PD8,   lqfp100: 55, signal: "ULD_R0",        peripheral: GPIO,   af: "-",dir: in,     note: "REF_ULD latch Q, reference lane 0."}
  - {pin: PD9,   lqfp100: 56, signal: "ULD_R1",        peripheral: GPIO,   af: "-",dir: in,     note: "REF_ULD latch Q, reference lane 1."}
  - {pin: PD10,  lqfp100: 57, signal: "ULD_R2",        peripheral: GPIO,   af: "-",dir: in,     note: "REF_ULD latch Q, reference lane 2."}
  - {pin: PD11,  lqfp100: 58, signal: "ULD_R3",        peripheral: GPIO,   af: "-",dir: in,     note: "REF_ULD latch Q, reference lane 3."}
  - {pin: PD12,  lqfp100: 59, signal: "LLD_F0",        peripheral: TIM4,   af: 2,  dir: in,     note: "RAW (unlatched) BETA_LLD comparator output, floor lane 0, on TIM4_CH1 input capture (either or both edges selectable; firmware captures the falling edge, the rising edge is the BUSY capture): time over threshold of the triggering pulse. The level is still read through GPIOD->IDR (must be low before the chain is cleared). 100 k ext PD."}
  - {pin: PD13,  lqfp100: 60, signal: "LLD_F1",        peripheral: TIM4,   af: 2,  dir: in,     note: "RAW (unlatched) BETA_LLD comparator output, floor lane 1, on TIM4_CH2 input capture (either or both edges selectable; firmware captures the falling edge, the rising edge is the BUSY capture): time over threshold of the triggering pulse. The level is still read through GPIOD->IDR (must be low before the chain is cleared). 100 k ext PD."}
  - {pin: PD14,  lqfp100: 61, signal: "LLD_F2",        peripheral: TIM4,   af: 2,  dir: in,     note: "RAW (unlatched) BETA_LLD comparator output, floor lane 2, on TIM4_CH3 input capture (either or both edges selectable; firmware captures the falling edge, the rising edge is the BUSY capture): time over threshold of the triggering pulse. The level is still read through GPIOD->IDR (must be low before the chain is cleared). 100 k ext PD."}
  - {pin: PD15,  lqfp100: 62, signal: "LLD_F3",        peripheral: TIM4,   af: 2,  dir: in,     note: "RAW (unlatched) BETA_LLD comparator output, floor lane 3, on TIM4_CH4 input capture (either or both edges selectable; firmware captures the falling edge, the rising edge is the BUSY capture): time over threshold of the triggering pulse. The level is still read through GPIOD->IDR (must be low before the chain is cleared). 100 k ext PD."}
  - {pin: PE2,   lqfp100: 1,  signal: "LLD_R0",        peripheral: TIM3,   af: 2,  dir: in,     note: "RAW REF_LLD comparator output, reference lane 0, on TIM3_CH1 input capture (as LLD_F): time over threshold; level read through GPIOE->IDR. 100 k ext PD."}
  - {pin: PE3,   lqfp100: 2,  signal: "LLD_R1",        peripheral: TIM3,   af: 2,  dir: in,     note: "RAW REF_LLD comparator output, reference lane 1, on TIM3_CH2 input capture (as LLD_F): time over threshold; level read through GPIOE->IDR. 100 k ext PD."}
  - {pin: PE4,   lqfp100: 3,  signal: "LLD_R2",        peripheral: TIM3,   af: 2,  dir: in,     note: "RAW REF_LLD comparator output, reference lane 2, on TIM3_CH3 input capture (as LLD_F): time over threshold; level read through GPIOE->IDR. 100 k ext PD."}
  - {pin: PE5,   lqfp100: 4,  signal: "LLD_R3",        peripheral: TIM3,   af: 2,  dir: in,     note: "RAW REF_LLD comparator output, reference lane 3, on TIM3_CH4 input capture (as LLD_F): time over threshold; level read through GPIOE->IDR. 100 k ext PD."}
  - {pin: PE0,   lqfp100: 97, signal: "CLR_F0_N",      peripheral: GPIO,   af: "-",dir: out,    note: "Clear of all three latches of floor lane 0, active low pulse (>= 20 ns, firmware gives ~100 ns). 10 k ext PD: latches are held cleared (chain idle, BUSY low) while the MCU is in reset."}
  - {pin: PE1,   lqfp100: 98, signal: "CLR_F1_N",      peripheral: GPIO,   af: "-",dir: out,    note: "Clear of all three latches of floor lane 1, active low pulse (>= 20 ns, firmware gives ~100 ns). 10 k ext PD: latches are held cleared (chain idle, BUSY low) while the MCU is in reset."}
  - {pin: PE6,   lqfp100: 5,  signal: "CLR_F2_N",      peripheral: GPIO,   af: "-",dir: out,    note: "Clear of all three latches of floor lane 2, active low pulse (>= 20 ns, firmware gives ~100 ns). 10 k ext PD: latches are held cleared (chain idle, BUSY low) while the MCU is in reset."}
  - {pin: PE7,   lqfp100: 38, signal: "CLR_F3_N",      peripheral: GPIO,   af: "-",dir: out,    note: "Clear of all three latches of floor lane 3, active low pulse (>= 20 ns, firmware gives ~100 ns). 10 k ext PD: latches are held cleared (chain idle, BUSY low) while the MCU is in reset."}
  - {pin: PE10,  lqfp100: 41, signal: "CLR_R0_N",      peripheral: GPIO,   af: "-",dir: out,    note: "Clear of both latches of reference lane 0, active low pulse. 10 k ext PD. All eight CLR lines are on GPIOE so one BSRR write can clear several chains."}
  - {pin: PE11,  lqfp100: 42, signal: "CLR_R1_N",      peripheral: GPIO,   af: "-",dir: out,    note: "Clear of both latches of reference lane 1, active low pulse. 10 k ext PD. All eight CLR lines are on GPIOE so one BSRR write can clear several chains."}
  - {pin: PE12,  lqfp100: 43, signal: "CLR_R2_N",      peripheral: GPIO,   af: "-",dir: out,    note: "Clear of both latches of reference lane 2, active low pulse. 10 k ext PD. All eight CLR lines are on GPIOE so one BSRR write can clear several chains."}
  - {pin: PE13,  lqfp100: 44, signal: "CLR_R3_N",      peripheral: GPIO,   af: "-",dir: out,    note: "Clear of both latches of reference lane 3, active low pulse. 10 k ext PD. All eight CLR lines are on GPIOE so one BSRR write can clear several chains."}
