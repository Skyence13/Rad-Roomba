  - {pin: PA3,   lqfp100: 25, signal: "BIAS_IMON",     peripheral: ADC1,   af: "-",dir: analog, note: "Total bias current BIAS_IMON = 0.8 x I x R2206 (10 k) = 8.0 mV per uA, 250 uA at 2.0 V (budget 5.1); includes the two bias dividers (about 30 uA at 60 V). 1 k series R2207.", channel: 4}
