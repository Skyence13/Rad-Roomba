# RR-HEAD-ACQ head MCU pin map PROPOSAL (firmware -> electronics). Owner: head firmware lead.
# MCU: STM32G474RET6, LQFP64. Source of truth for firmware/head/port/stm32g474/rrh_pins.h and the
# hardware mapping table in firmware/head/README.md (both generated by tools/gen_pinmap.py).
#
# Evidence: every pin number and every alternate-function number below was checked by
# tools/check_pinmap.py against ST's machine-readable pin database
# (STMicroelectronics/STM32_open_pin_data: mcu/STM32G474R(B-C-E)Tx.xml and
# mcu/IP/GPIO-STM32G47x_gpio_v1_0_Modes.xml, fetched 2026-11-25) -> class "tool-checked".
# Not checked against the datasheet PDF (st.com unreachable from the build host). Items that
# are recalled from memory only carry the word UNVERIFIED in their note.
#
# Conventions: dir is seen from the MCU (in/out/bidir/analog/power). af: "-" means GPIO,
# analog or a dedicated function. All logic is 3.3 V. "ext PD"/"ext PU" = external resistor
# required so the pin has a safe level while the MCU is in reset.
mcu: STM32G474RET6
package: LQFP64
clock:
  source: "24 MHz TCXO shared with the FPGA, clipped-sine or CMOS into PF0-OSC_IN, HSE bypass"
  sysclk_hz: 48000000
  pll: "HSE 24 MHz / M=3 -> 8 MHz, x N=12 -> 96 MHz VCO, /R=2 -> 48 MHz SYSCLK, /Q=2 -> 48 MHz (RNG)"
  note: "48 MHz keeps the MCU in voltage range 1 normal mode with 1 flash wait state (wait-state table UNVERIFIED against RM0440); 1 Mbaud divides exactly (BRR = 48)."
peripherals:
  USART1:  "RS-485 host link, 1 Mbaud 8N1, hardware driver-enable (DEM) on USART1_DE"
  LPUART1: "debug console 115200 8N1 (same pins as the NUCLEO-G474RE ST-LINK VCP)"
  SPI1:    "threshold/trim DACs, 4 x DAC60508, mode 1, <= 12 MHz, one GPIO chip-select each"
  SPI3:    "FPGA: slave-configuration of the iCE40UP5K at boot (mode 3), register interface afterwards (mode 0, <= 4 MHz, see gateware/head_evt/regmap.yaml)"
  I2C3:    "TMP117 x2 (0x48, 0x49) and 24AA025E64 EUI EEPROM (0x50), 100 kHz"
  ADC1:    "housekeeping scan: bias V/I, 4 SiPM NTC, heater NTC, board NTC, supply, heater sense, internal temperature and VREFINT"
  ADC2:    "monitor waveform capture (engineering), DMA circular, stopped after the FPGA trigger"
  TIM2:    "32-bit 1 MHz head clock (extended to 64 bit in software); CH3 input capture = FPGA gate boundary; CH2 output compare = FPGA_SYNC edge; CH1 compare (no pin) = scheduled start of a TIME reply"
  IWDG:    "independent watchdog (LSI), ~1 s"
  RNG:     "TRNG for the boot UUID (48 MHz from PLLQ)"
pins:
  # ---- supplies and system
  - {pin: VBAT,  lqfp64: 1,  signal: VBAT,           peripheral: power,  af: "-", dir: power,  note: "Tie to +3V3 (no backup domain use)."}
  - {pin: VSS,   lqfp64: 15, signal: GND,            peripheral: power,  af: "-", dir: power,  note: "Also pins 31, 47, 63."}
  - {pin: VDD,   lqfp64: 16, signal: "+3V3",         peripheral: power,  af: "-", dir: power,  note: "Also pins 32, 48, 64. 100 nF each + 4.7 uF bulk."}
  - {pin: VSSA,  lqfp64: 27, signal: AGND,           peripheral: power,  af: "-", dir: power,  note: "Star point to GND at the MCU."}
  - {pin: VREF+, lqfp64: 28, signal: VREF_ADC,       peripheral: power,  af: "-", dir: power,  note: "External 3.0 V reference preferred (shared with the DAC reference budget); else VDDA through 0 R. 1 uF + 100 nF."}
  - {pin: VDDA,  lqfp64: 29, signal: "+3V3A",        peripheral: power,  af: "-", dir: power,  note: "Filtered from +3V3 (ferrite + 1 uF + 10 nF)."}
  - {pin: PG10,  lqfp64: 7,  signal: NRST,           peripheral: SYS,    af: "-", dir: bidir,  note: "100 nF to GND, to SWD header pin 10. No other driver."}
  - {pin: PB8,   lqfp64: 61, signal: BOOT0,          peripheral: SYS,    af: "-", dir: in,     note: "10 k ext PD + test point / jumper to +3V3 for the ROM bootloader. Not used as GPIO."}
  - {pin: PF0,   lqfp64: 5,  signal: HSE_IN_24M,     peripheral: RCC,    af: "-", dir: in,     note: "RCC_OSC_IN, HSE bypass. Same TCXO net as the FPGA clock pin; separate series resistors at the buffer."}
  - {pin: PA13,  lqfp64: 49, signal: SWDIO,          peripheral: SYS,    af: 0,   dir: bidir,  note: "SWD header (ARM 10-pin 1.27 mm / TC2030)."}
  - {pin: PA14,  lqfp64: 50, signal: SWCLK,          peripheral: SYS,    af: 0,   dir: in,     note: "SWD header."}
  - {pin: PB3,   lqfp64: 56, signal: FPGA_SYNC,      peripheral: TIM2,   af: 1,   dir: out,    note: "TIM2_CH2 output compare to the FPGA SYNC_IN pin: a hardware-timed edge whose head-clock time is known; the FPGA latches its tick counter on it (SYNC_TICK), which gives the tick <-> microsecond epoch for every ARM. Gives up SWO trace (PB3 is the only SWO pin)."}
  # ---- RS-485 host link (isolated transceiver, logic side)
  - {pin: PA9,   lqfp64: 43, signal: RS485_TX,       peripheral: USART1, af: 7,   dir: out,    note: "USART1_TX to the isolator DI. Idle high."}
  - {pin: PA10,  lqfp64: 44, signal: RS485_RX,       peripheral: USART1, af: 7,   dir: in,     note: "USART1_RX from the isolator RO. 10 k ext PU so a disabled receiver reads mark."}
  - {pin: PA12,  lqfp64: 46, signal: RS485_DE,       peripheral: USART1, af: 7,   dir: out,    note: "USART1_DE (shared with RTS), active high, 10 k ext PD. Tie the transceiver /RE to DE so the head does not hear its own transmission."}
  # ---- debug console
  - {pin: PA2,   lqfp64: 14, signal: DBG_TX,         peripheral: LPUART1, af: 12, dir: out,    note: "LPUART1_TX to a 3-pin debug header. NUCLEO-G474RE: ST-LINK VCP RX (Nucleo wiring UNVERIFIED, recalled)."}
  - {pin: PA3,   lqfp64: 17, signal: DBG_RX,         peripheral: LPUART1, af: 12, dir: in,     note: "LPUART1_RX, 100 k ext PU."}
  # ---- threshold / trim / HV-setpoint / pulser DACs (4 x DAC60508 on one SPI bus)
  - {pin: PA5,   lqfp64: 19, signal: DAC_SCK,        peripheral: SPI1,   af: 5,   dir: out,    note: "SPI1_SCK. Quiet outside configuration: DACs are written only between gates or while disarmed."}
  - {pin: PA6,   lqfp64: 20, signal: DAC_MISO,       peripheral: SPI1,   af: 5,   dir: in,     note: "SPI1_MISO, DAC SDO wired-OR (SDO is high-Z when /CS is high; DAC60508 behaviour UNVERIFIED), 100 k ext PU."}
  - {pin: PA7,   lqfp64: 21, signal: DAC_MOSI,       peripheral: SPI1,   af: 5,   dir: out,    note: "SPI1_MOSI."}
  - {pin: PA4,   lqfp64: 18, signal: DAC_CS0_N,      peripheral: GPIO,   af: "-", dir: out,    note: "U_DAC0 /CS (lanes 0-1 floor thresholds: BETA_LLD, BETA_ULD, ALPHA x2 + 2 spare outputs). 10 k ext PU."}
  - {pin: PC4,   lqfp64: 22, signal: DAC_CS1_N,      peripheral: GPIO,   af: "-", dir: out,    note: "U_DAC1 /CS (lanes 2-3 floor thresholds). 10 k ext PU."}
  - {pin: PC5,   lqfp64: 23, signal: DAC_CS2_N,      peripheral: GPIO,   af: "-", dir: out,    note: "U_DAC2 /CS (4 x REF_LLD, 4 x REF_ULD). 10 k ext PU."}
  - {pin: PB2,   lqfp64: 26, signal: DAC_CS3_N,      peripheral: GPIO,   af: "-", dir: out,    note: "U_DAC3 /CS (8 x SiPM anode trim). 10 k ext PU. HV set-point and pulser amplitude use the two spare outputs of U_DAC0/U_DAC1 (see dac_map)."}
  # ---- FPGA (iCE40UP5K-SG48) configuration + register SPI
  - {pin: PC10,  lqfp64: 52, signal: FPGA_SCK,       peripheral: SPI3,   af: 6,   dir: out,    note: "SPI3_SCK to iCE40 SPI_SCK (SG48 pin 15, FPGA pin number UNVERIFIED)."}
  - {pin: PC11,  lqfp64: 53, signal: FPGA_MISO,      peripheral: SPI3,   af: 6,   dir: in,     note: "SPI3_MISO from the FPGA register interface (user I/O after configuration; iCE40 SPI_SO pin 14 UNVERIFIED)."}
  - {pin: PC12,  lqfp64: 54, signal: FPGA_MOSI,      peripheral: SPI3,   af: 6,   dir: out,    note: "SPI3_MOSI to iCE40 SPI_SI (pin 17, UNVERIFIED): bitstream at boot, register writes afterwards."}
  - {pin: PA15,  lqfp64: 51, signal: FPGA_SS_N,      peripheral: GPIO,   af: "-", dir: out,    note: "iCE40 SPI_SS (pin 16, UNVERIFIED). Must be low when CRESET_B rises to select slave configuration: 10 k ext PD. (Pin is JTDI with an internal pull-up at reset; the external PD wins, verify value.)"}
  - {pin: PD2,   lqfp64: 55, signal: FPGA_CRESET_N,  peripheral: GPIO,   af: "-", dir: out,    note: "iCE40 CRESET_B, 10 k ext PD so the FPGA stays unconfigured (all outputs high-Z, counters off) while the MCU is in reset."}
  - {pin: PB9,   lqfp64: 62, signal: FPGA_CDONE,     peripheral: GPIO,   af: "-", dir: in,     note: "iCE40 CDONE open-drain, 10 k ext PU to +3V3 (FPGA bank supply)."}
  - {pin: PB10,  lqfp64: 30, signal: FPGA_GATE,      peripheral: TIM2,   af: 1,   dir: in,     note: "TIM2_CH3 input capture of the FPGA GATE_SYNC output, which toggles on the first tick of every gate (capture both edges): head-clock time of every gate boundary, used to cross-check equal gates. 100 k ext PD."}
  - {pin: PB5,   lqfp64: 58, signal: FPGA_MON_TRIG,  peripheral: EXTI5,  af: "-", dir: in,     note: "FPGA TRIG_OUT (active-high pulse on a selected event): stops the ADC2 monitor capture after the post-trigger count. 100 k ext PD."}
  - {pin: PB6,   lqfp64: 59, signal: FPGA_IRQ,       peripheral: EXTI6,  af: "-", dir: in,     note: "FPGA IRQ, level, active high: gate record ready (and optional sources). 100 k ext PD. PB6 is UCPD1_CC1: a dead-battery pull-down can be present until firmware sets PWR_CR3.UCPD1_DBDIS (behaviour UNVERIFIED) - harmless for an active-high input with a pull-down."}
  # ---- analog housekeeping (ADC1)
  - {pin: PA1,   lqfp64: 13, signal: BIAS_VMON,      peripheral: ADC1,   af: "-", dir: analog, channel: 2,  note: "SiPM bias voltage after the output filter, divider 60 V -> 2.4 V (1:25), 10 nF at the pin, source < 10 k."}
  - {pin: PB12,  lqfp64: 34, signal: BIAS_IMON,      peripheral: ADC1,   af: "-", dir: analog, channel: 11, note: "Bias current monitor, 0-2.5 V = 0-250 uA total (scale to be fixed by head electronics)."}
  - {pin: PC0,   lqfp64: 8,  signal: NTC_SIPM0,      peripheral: ADC1,   af: "-", dir: analog, channel: 6,  note: "10 k B3435-class NTC at lane 0 SiPMs, 10.0 k 0.1 % to VREF_ADC, 100 nF."}
  - {pin: PC1,   lqfp64: 9,  signal: NTC_SIPM1,      peripheral: ADC1,   af: "-", dir: analog, channel: 7,  note: "Lane 1, as NTC_SIPM0."}
  - {pin: PC2,   lqfp64: 10, signal: NTC_SIPM2,      peripheral: ADC1,   af: "-", dir: analog, channel: 8,  note: "Lane 2, as NTC_SIPM0."}
  - {pin: PC3,   lqfp64: 11, signal: NTC_SIPM3,      peripheral: ADC1,   af: "-", dir: analog, channel: 9,  note: "Lane 3, as NTC_SIPM0."}
  - {pin: PB0,   lqfp64: 24, signal: NTC_HTR,        peripheral: ADC1,   af: "-", dir: analog, channel: 15, note: "Heater-plate NTC (same network). Open/short detection in firmware."}
  - {pin: PB14,  lqfp64: 36, signal: NTC_BOARD,      peripheral: ADC1,   af: "-", dir: analog, channel: 5,  note: "Board NTC near the bias converter (same network)."}
  - {pin: PB1,   lqfp64: 25, signal: VIN_MON,        peripheral: ADC1,   af: "-", dir: analog, channel: 12, note: "HEAD_PWR after input protection, divider 1:6.6 (16.5 V full scale), 100 nF."}
  - {pin: PB11,  lqfp64: 33, signal: HTR_SENSE,      peripheral: ADC1,   af: "-", dir: analog, channel: 14, note: "Current-sense output of the heater high-side switch (scale by electronics); lets firmware detect an open element or a stuck switch."}
  # ---- monitor path (engineering waveform capture)
  - {pin: PA0,   lqfp64: 12, signal: MON_ADC,        peripheral: ADC2,   af: "-", dir: analog, channel: 1,  note: "Buffered monitor mux output, 0-3 V, anti-alias RC ~ 1 MHz. Channel is ADC12_IN1 so ADC1+ADC2 interleaving stays possible."}
  - {pin: PC6,   lqfp64: 38, signal: MON_MUX_A0,     peripheral: GPIO,   af: "-", dir: out,    note: "Monitor mux select bit 0 (channel 0-7 = floor 0-3, ref 0-3)."}
  - {pin: PC7,   lqfp64: 39, signal: MON_MUX_A1,     peripheral: GPIO,   af: "-", dir: out,    note: "Monitor mux select bit 1."}
  - {pin: PC8,   lqfp64: 40, signal: MON_MUX_A2,     peripheral: GPIO,   af: "-", dir: out,    note: "Monitor mux select bit 2."}
  - {pin: PF1,   lqfp64: 6,  signal: MON_MUX_A3,     peripheral: GPIO,   af: "-", dir: out,    note: "Monitor mux select bit 3 (0 = fast path, 1 = slow path). GPIO only because HSE runs in bypass mode. NUCLEO-G474RE: crystal pin, not usable there."}
  # ---- bias and heater
  - {pin: PB13,  lqfp64: 35, signal: HV_EN,          peripheral: GPIO,   af: "-", dir: out,    note: "SiPM bias converter enable, active high, 10 k ext PD (bias off in reset)."}
  - {pin: PB15,  lqfp64: 37, signal: HTR_EN,         peripheral: GPIO,   af: "-", dir: out,    note: "Heater permit, active high, 10 k ext PD (heater off in reset). The switch input is HTR_EN AND the FPGA HTR_SYNC output: the FPGA applies the requested state (register HTR_CTRL) on a gate boundary, the MCU can remove the permit at any time, and an unconfigured FPGA or an MCU in reset both mean heater off. The actual switch state goes back to the FPGA HTR_STATE input (heater_on_ticks, transition marker). The hardware thermal cut-out is in series and cannot be overridden."}
  - {pin: PA11,  lqfp64: 45, signal: HTR_CUTOUT_OK,  peripheral: GPIO,   af: "-", dir: in,     note: "Status of the independent thermal cut-out: high = closed/healthy, low = tripped or heater supply absent. Level-shifted from the heater domain, 100 k ext PD."}
  # ---- temperature / identity bus
  - {pin: PA8,   lqfp64: 42, signal: I2C_SCL,        peripheral: I2C3,   af: 2,   dir: bidir,  note: "I2C3_SCL, 2.2 k ext PU. TMP117 x2 + 24AA025E64."}
  - {pin: PC9,   lqfp64: 41, signal: I2C_SDA,        peripheral: I2C3,   af: 8,   dir: bidir,  note: "I2C3_SDA, 2.2 k ext PU."}
  # ---- bumper zone identification (auxiliary NO contacts; the series NC loop never reaches the MCU)
  - {pin: PC13,  lqfp64: 2,  signal: BUMP_ZONE_F_N,  peripheral: GPIO,   af: "-", dir: in,     note: "Front zone auxiliary contact to GND, active low, 10 k ext PU + 1 k series + 100 nF + TVS. Backup-domain pin: input only. NUCLEO-G474RE: user button B1 (UNVERIFIED, recalled)."}
  - {pin: PC14,  lqfp64: 3,  signal: BUMP_ZONE_L_N,  peripheral: GPIO,   af: "-", dir: in,     note: "Left zone, as front. Backup-domain pin: input only. NUCLEO: LSE crystal, not usable there."}
  - {pin: PC15,  lqfp64: 4,  signal: BUMP_ZONE_R_N,  peripheral: GPIO,   af: "-", dir: in,     note: "Right zone, as front. Backup-domain pin: input only. NUCLEO: LSE crystal, not usable there."}
  # ---- indicators
  - {pin: PB4,   lqfp64: 57, signal: LED_STATUS_N,   peripheral: GPIO,   af: "-", dir: out,    note: "Green, active low to +3V3 through 1 k (off while the reset-state pull-up is active). PB4 is JTRST at reset and UCPD1_CC2 (dead-battery pull-down UNVERIFIED) - LED only, nothing critical."}
  - {pin: PB7,   lqfp64: 60, signal: LED_FAULT_N,    peripheral: GPIO,   af: "-", dir: out,    note: "Red, active low to +3V3 through 1 k."}
# DAC output allocation (firmware/head/core/rrh_setup.h uses the same indices). DAC60508: 12-bit, 8 outputs.
dac_map:
  U_DAC0: {cs: DAC_CS0_N, outputs: [BETA_LLD_0, BETA_ULD_0, ALPHA_0, BETA_LLD_1, BETA_ULD_1, ALPHA_1, HV_SET, SPARE]}
  U_DAC1: {cs: DAC_CS1_N, outputs: [BETA_LLD_2, BETA_ULD_2, ALPHA_2, BETA_LLD_3, BETA_ULD_3, ALPHA_3, PULSER_AMPL, SPARE]}
  U_DAC2: {cs: DAC_CS2_N, outputs: [REF_LLD_0, REF_ULD_0, REF_LLD_1, REF_ULD_1, REF_LLD_2, REF_ULD_2, REF_LLD_3, REF_ULD_3]}
  U_DAC3: {cs: DAC_CS3_N, outputs: [TRIM_FLOOR_0, TRIM_FLOOR_1, TRIM_FLOOR_2, TRIM_FLOOR_3, TRIM_REF_0, TRIM_REF_1, TRIM_REF_2, TRIM_REF_3]}
unused_pins: []
spares: "None: all 52 I/O pins of the LQFP64 package are committed (PB3 gave up SWO for FPGA_SYNC). If more are needed, heater sense (PB11) or the board NTC (PB14) are the first candidates to give up; BOOT0 (PB8) can be freed with the nSWBOOT0 option bit (UNVERIFIED) at the cost of the hardware bootloader strap."
nucleo_g474re_bringup:
  note: "Bring-up on a NUCLEO-G474RE (MB1367) uses the same firmware with -DRRH_BOARD_NUCLEO: HSE crystal instead of bypass (24 MHz X3 fitted, UNVERIFIED), console on the ST-LINK VCP, RS-485 through an external 3.3 V transceiver on PA9/PA10/PA12. BUMP_ZONE_L/R and MON_MUX_A3 are not available (crystal pins). Header positions are in the Nucleo user manual UM2505 (not checked here)."
