  - {pin: PA12,  lqfp100: 73, signal: "RS485_DE",      peripheral: USART1, af: 7,  dir: out,    note: "USART1_DE, active high, 10 k ext PD. Tie the transceiver /RE to DE so the head does not hear its own transmission."}
  - {pin: PC10,  lqfp100: 79, signal: "DBG_TX",        peripheral: UART4,  af: 5,  dir: out,    note: "UART4_TX to a 3-pin debug header."}
  - {pin: PC11,  lqfp100: 80, signal: "DBG_RX",        peripheral: UART4,  af: 5,  dir: in,     note: "UART4_RX, 100 k ext PU."}
