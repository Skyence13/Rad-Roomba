  - {pin: PB4,   lqfp100: 91, signal: "LED_STATUS_N",  peripheral: GPIO,   af: "-",dir: out,    note: "Green, active low to +3V3 through 1 k. PB4 is JTRST at reset and UCPD1_CC2 (dead-battery pull-down behaviour UNVERIFIED): LED only."}
