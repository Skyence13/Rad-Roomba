  - {pin: PC1,   lqfp100: 16, signal: "NTC_SIPM1",     peripheral: ADC1,   af: "-",dir: analog, note: "10 k B3435-class NTC at lane 1 SiPMs to AGND, 10.0 k 0.1 % to VREF_ADC, 100 nF.", channel: 7}
  - {pin: PC2,   lqfp100: 17, signal: "NTC_SIPM2",     peripheral: ADC1,   af: "-",dir: analog, note: "10 k B3435-class NTC at lane 2 SiPMs to AGND, 10.0 k 0.1 % to VREF_ADC, 100 nF.", channel: 8}
  - {pin: PC3,   lqfp100: 18, signal: "NTC_SIPM3",     peripheral: ADC1,   af: "-",dir: analog, note: "10 k B3435-class NTC at lane 3 SiPMs to AGND, 10.0 k 0.1 % to VREF_ADC, 100 nF.", channel: 9}
