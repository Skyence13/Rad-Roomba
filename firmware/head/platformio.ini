; STM32G474VET6 image of the head firmware (RR-HEAD-ACQ). Host builds use CMakeLists.txt instead.
; Versions are pinned: platform, toolchain and CMSIS packages are fetched from the PlatformIO
; registry at exactly these versions.
[platformio]
src_dir = .
build_dir = .pio/build
default_envs = rr_head_acq

[env]
platform = platformio/ststm32@19.4.0
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.120301.0
    platformio/framework-cmsis@2.50501.200527
    platformio/framework-cmsis-stm32g4@1.2.5
    platformio/tool-ldscripts-ststm32@0.2.0
framework = cmsis
; The registry has no STM32G474VE board; the NUCLEO-G474RE definition has the same die, flash
; (512 kB), RAM (128 kB), startup file and linker script. Only the package differs.
board = nucleo_g474re
board_build.mcu = stm32g474vet6
build_src_filter = -<*> +<core/*.c> +<port/stm32g474/*.c>
extra_scripts = pre:tools/pio_common.py
build_flags =
    -std=c11 -Os -g -Wall -Wextra -Wshadow -Wstrict-prototypes -Wno-unused-parameter
    -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--no-warn-rwx-segments
    -Wl,-Map,${BUILD_DIR}/firmware.map
    -Icore -Ihal -Iport/stm32g474 -I../common/include
build_unflags = -std=gnu11
upload_protocol = stlink
debug_tool = stlink

[env:rr_head_acq]
; production board: 24 MHz TCXO, HSE bypass

[env:nucleo_bringup]
; NUCLEO-G474RE bring-up: HSE crystal, no ports D/E (see README)
build_flags = ${env.build_flags} -DRRH_BOARD_NUCLEO
