# RR-CHS-MAIN motion MCU pin map PROPOSAL (firmware -> electronics)
# Owner: chassis firmware lead. Status: rev P2 = as adopted by RR-CHS-MAIN rev A stage 2 (netlist export
# electronics/chassis_main/out/pinmap.json, cross-checked by tools/check_pinmap.py). Rev P1 was the proposal for schematic capture. The electronics
# lead adopts/edits; firmware regenerates port/stm32g474/board_pins.h from this file
# (tools/check_pinmap.py --emit-header) so schematic and firmware cannot drift silently.
#
# Evidence:
#   tool-checked  LQFP64 pin numbers, signal availability and AF numbers are checked by
#                 tools/check_pinmap.py against tools/stm32g474r_lqfp64_pindata.json (extracted from
#                 ST "STM32_open_pin_data" and the Zephyr hal_stm32 pinctrl table, 2026-11-25).
#   UNVERIFIED    everything in an `unverified:` field or note marked UNVERIFIED is recalled from
#                 datasheets from memory and must be checked against the datasheet by the schematic
#                 owner (external-device pin behaviour, expander addresses, bootloader details).
#   Nothing here has been tested on hardware.
#
# Logic convention for readbacks: MCU pin HIGH = element closed / healthy / present / asserted-good,
# unless `active: low` is given. A broken readback wire must read as "not healthy".
# This MCU does NOT implement a certified safety function. The hardwired chain works without it.

mcu:
  part: STM32G474RET6
  package: LQFP64
  io_available: 51          # PA0-15, PB0-15, PC0-15, PD2, PF0, PF1 (PG10 is NRST)
  io_used: 51               # 50 assigned + 1 spare/SWO (PB3)
  supply: {vdd: 3.3, vdda: 3.3, vref: 3.000, vref_note: "VREF+ = VREF_3V0 from REF3030 (U14), 3.000 V +-0.2 % (CCR-E03 a). All ADC scaling, the NTC and PRES_ID pull-ups and the DRV8874 VREF pins use it."}
  clock:
    hse: "8 MHz or 24 MHz crystal on PF0/PF1 (firmware build option RR_HSE_HZ; default 8 MHz)"
    sysclk_hz: 144000000    # PLL from HSE: VCO 288 MHz, /R=2 -> 144 MHz, /Q=6 -> 48 MHz for USB (no CRS dependence)
    note: "170 MHz is not used: 48 MHz USB clock cannot be derived from a 340 MHz VCO; 144 MHz is ample."
  reset_state_rule: "All GPIO are analog/high-Z after reset. Every output listed with `reset_state` needs the external pull resistor shown so the board is safe with the MCU held in reset, unprogrammed, or in the ROM bootloader."

# ----------------------------------------------------------------------------- native pins
pins:
  # --- motor current / voltage / presence analog (ADC1/ADC2, 12-bit, sampled in the 1 kHz control tick; currents PWM-synchronous)
  - {pin: PA0,  lqfp64: 12, signal: IPROPI_L,       function: ADC1_IN1,  af: ANALOG, dir: in,  note: "DRV8874 IPROPI left bridge. RIPROPI 2.49 kOhm (R153) -> 1.1205 V/A, i.e. 0.8925 A/V (CCR-E03 b); 1 kOhm series (R154). The bridge VREF pin is on VREF_3V0, so the hardware chop limit 3.000 V / 1.1205 V/A = 2.68 A is also the ADC full scale: readings saturate at 2.68 A. Constant RR_IPROPI_V_PER_A in bsp.h."}
  - {pin: PA1,  lqfp64: 13, signal: IPROPI_R,       function: ADC2_IN2,  af: ANALOG, dir: in,  note: "As IPROPI_L, right bridge. ADC1+ADC2 dual simultaneous sampling at PWM centre."}
  - {pin: PA2,  lqfp64: 14, signal: VMOT_SENSE,     function: ADC1_IN3,  af: ANALOG, dir: in,  note: "VMOT divider 47k/10k (16.0 V -> 2.81 V; full scale 17.1 V at VREF+ 3.000 V), 100 nF. Safety-relevant readback: after a latch drop VMOT decays through the 1 kOhm bleed on 810 uF (tau 0.8 s): < 1 V after about 2.1 s (brake.vmot_decay_max_ms 2500)."}
  - {pin: PA3,  lqfp64: 17, signal: VBAT_SENSE,     function: ADC1_IN4,  af: ANALOG, dir: in,  note: "VBAT_SW divider 47k/10k. Fast brown-out logging and I2C-independent low-battery check (INA228 is the accurate source)."}
  - {pin: PC0,  lqfp64: 8,  signal: HEAD_PRES_ID,   function: ADC1_IN6,  af: ANALOG, dir: in,  note: "J1 pin 7 (J_HEAD1 pin 7). 4.70 kOhm 0.1 % pull-up (R77) to VREF+ directly on the connector node; no series resistance in the measured path (CCR-E03 c). TVS D12. To the ADC through 1k (R78) + 1k (R84) + 10 nF; the middle node PRES_F also feeds the LAB_KEY_N window comparator U31. Code resistor returns to J1 pin 2. R = 4700 x/(1-x), x = ADC/4095. Sampled every 1 ms."}
  - {pin: PC1,  lqfp64: 9,  signal: HEAD_LOOP_SENSE, function: ADC1_IN7, af: ANALOG, dir: in,  note: "Analog copy of the J1 5/6 loop sense voltage (lower 1.00 kOhm R71), 10 kOhm series (R76), BAT54 clamp, 10 nF. Loop source: V5_AUX - 1.00k - 100 R - J1.5 - head - J1.6 - 100 R - 1.00k - GND, so V = V5_AUX x 1000/(2200 + R_loop); firmware R_loop = 1000 V5_AUX / V - 2200 with V5_AUX = 5.0 V nominal (UNVERIFIED tolerance; the hardware window is ratiometric, this copy is not). Healthy 1.56 V, 0.6k 1.79 V, 1.6k 1.32 V."}
  - {pin: PC2,  lqfp64: 10, signal: NTC_BAY,        function: ADC1_IN8,  af: ANALOG, dir: in,  note: "10 kOhm B3435-class NTC (J_NTC pin 1) in the battery bay, 10.0 kOhm pull-up (R215) to VREF+ 3.000 V, 1 kOhm series (R216) + 100 nF. Used for heater regulation."}
  - {pin: PC3,  lqfp64: 11, signal: NTC_PACK,       function: ADC1_IN9,  af: ANALOG, dir: in,  note: "Second NTC on the pack surface (J_NTC pin 3, R217 pull-up, R218 series; heater plausibility + battery.temp_c[1]). Its return shares pack negative (offset accepted, STAGE2 IB-37). The charger measures its own thermistor (battery.temp_c[0])."}
  - {pin: PC4,  lqfp64: 22, signal: NTC_BOARD,      function: ADC2_IN5,  af: ANALOG, dir: in,  note: "NTC next to the H-bridges. MCU internal temperature sensor is the cross-check."}
  - {pin: PB1,  lqfp64: 25, signal: V5_SENSE,       function: ADC1_IN12, af: ANALOG, dir: in,  note: "V5_CM5 divider 10k/10k."}

  # --- IMU + fast expander SPI
  - {pin: PA4,  lqfp64: 18, signal: IMU_CS_ACC_N,   function: GPIO,      af: GPIO,   dir: out, reset_state: "high via 10k pull-up", note: "BMI088 (U42) accelerometer CSB1 (pin 14). Stage 2 S2-05: U42 pin 2 tied to GND (GNDA on pins 2 and 4 per the KiCad stock symbol; UNVERIFIED against the Bosch datasheet). PS (pin 7) = GND = SPI [U]; SDO1/SDO2 joined on IMU_SDO; INT pins not connected (firmware polls)."}
  - {pin: PA5,  lqfp64: 19, signal: SPI1_SCK,       function: SPI1_SCK,  af: AF5,    dir: out, note: "SPI mode 3, <= 5 MHz. Shared: BMI088 accel, BMI088 gyro, IOX_A."}
  - {pin: PA6,  lqfp64: 20, signal: SPI1_MISO,      function: SPI1_MISO, af: AF5,    dir: in,  note: "33 Ohm series at sources."}
  - {pin: PA7,  lqfp64: 21, signal: SPI1_MOSI,      function: SPI1_MOSI, af: AF5,    dir: out, note: ""}
  - {pin: PC5,  lqfp64: 23, signal: IMU_CS_GYR_N,   function: GPIO,      af: GPIO,   dir: out, reset_state: "high via 10k pull-up", note: "BMI088 gyro CSB2."}
  - {pin: PB0,  lqfp64: 24, signal: IOX_A_CS_N,     function: GPIO,      af: GPIO,   dir: out, reset_state: "high via 10k pull-up", note: "Chip select of the fast SPI expander IOX_A (chain readbacks, 1 kHz)."}

  # --- I2C buses
  - {pin: PA8,  lqfp64: 42, signal: I2C_SYS_SDA,    function: I2C2_SDA,  af: AF4,    dir: bidir, note: "System bus 400 kHz, 2.2k pull-up: charger, pack monitor, branch monitor, IOX_B, IOX_C."}
  - {pin: PA9,  lqfp64: 43, signal: I2C_SYS_SCL,    function: I2C2_SCL,  af: AF4,    dir: bidir, note: "As above."}
  - {pin: PA15, lqfp64: 51, signal: I2C_TOF_SCL,    function: I2C1_SCL,  af: AF4,    dir: bidir, note: "ToF bus 400 kHz, 2.2k pull-up: two TCA9548A (0x70, 0x71) -> 11 x VL53L4ED. Separate from the system bus so a hung sensor cable cannot stop power telemetry."}
  - {pin: PB9,  lqfp64: 62, signal: I2C_TOF_SDA,    function: I2C1_SDA,  af: AF4,    dir: bidir, note: "As above."}

  # --- drive stage
  - {pin: PC6,  lqfp64: 38, signal: MOT_L_IN1,      function: TIM8_CH1,  af: AF4,    dir: out, reset_state: "low via 10k pull-down", note: "DRV8874-class IN1, 20 kHz centre-aligned PWM."}
  - {pin: PC7,  lqfp64: 39, signal: MOT_L_IN2,      function: TIM8_CH2,  af: AF4,    dir: out, reset_state: "low via 10k pull-down", note: "IN2."}
  - {pin: PC8,  lqfp64: 40, signal: MOT_R_IN1,      function: TIM8_CH3,  af: AF4,    dir: out, reset_state: "low via 10k pull-down", note: ""}
  - {pin: PC9,  lqfp64: 41, signal: MOT_R_IN2,      function: TIM8_CH4,  af: AF4,    dir: out, reset_state: "low via 10k pull-down", note: ""}
  - {pin: PA10, lqfp64: 44, signal: DRV_NSLEEP,     function: GPIO,      af: GPIO,   dir: out, reset_state: "low via 10k pull-down (bridges asleep)", note: "Both bridges. Recommend hardware AND with HW_LATCH so the bridges sleep whenever the latch is dropped, independent of firmware."}
  - {pin: PB4,  lqfp64: 57, signal: ENC_R_A,        function: TIM3_CH1,  af: AF2,    dir: in,  note: "Right encoder A after 5 V->3.3 V Schmitt buffer (encoder outputs need 5 V pull-ups). 100 pF. UNVERIFIED: PB4 carries the UCPD dead-battery pull-down after reset until firmware sets PWR_CR3.UCPD_DBDIS; drive it push-pull."}
  - {pin: PB5,  lqfp64: 58, signal: ENC_R_B,        function: TIM3_CH2,  af: AF2,    dir: in,  note: "Right encoder B."}
  - {pin: PB6,  lqfp64: 59, signal: ENC_L_A,        function: TIM4_CH1,  af: AF2,    dir: in,  note: "Left encoder A. Same UCPD dead-battery remark as PB4 (UNVERIFIED)."}
  - {pin: PB7,  lqfp64: 60, signal: ENC_L_B,        function: TIM4_CH2,  af: AF2,    dir: in,  note: "Left encoder B. 16-bit counters extended in software (max 10.7 kcounts/s -> 0.011 counts per 1 us; wrap every 6 s at full speed, sampled every 1 ms)."}

  # --- hardwired chain: outputs the MCU contributes
  - {pin: PB10, lqfp64: 30, signal: ARM_PERMIT,     function: GPIO,      af: GPIO,   dir: out, reset_state: "LOW via 4.7k pull-down (chain open)", note: "Chain element ARM_PERMIT, active high. Must not be bridged by any debug link."}
  - {pin: PB11, lqfp64: 33, signal: WDG_STROBE,     function: GPIO,      af: GPIO,   dir: out, reset_state: "static (no edges) -> watchdog times out", note: "WDI of the external window watchdog (TPS3430 class). Firmware strobes once per 10 ms from the supervision task only. UNVERIFIED: TPS3430 window ratio / timing programmed by CWD/SET pins - electronics lead selects 3 ms closed / 30 ms open or nearest; firmware period is a build constant (RR_WDG_STROBE_PERIOD_MS)."}

  # --- hardwired chain: safety-relevant readbacks on native pins (1 kHz sampled, change-latched)
  - {pin: PB12, lqfp64: 34, signal: ESTOP_A_RB,     function: GPIO,      af: GPIO,   dir: in,  note: "Tap on chain node CH_N2 (after E-stop pole A): 100k/56k (R99/R100) + 22 nF + Schottky clamp. HIGH = chain live up to and including pole A; unknown when CH_N1 (selector) is dead. NO internal pull (review M3: a 25-55 k pull-down loads the tap below VIH); configuration read back every 100 ms (PIN_CONFIG)."}
  - {pin: PB13, lqfp64: 35, signal: ESTOP_B_RB,     function: GPIO,      af: GPIO,   dir: in,  note: "E-stop pole B (COIL_RTN, low side of all three coils) through a P-MOSFET detector: HIGH = pole closed. Independent of the chain nodes. A/B disagreement > 200 ms while CH_N1 is live is ESTOP_DISCREPANCY."}
  - {pin: PD2,  lqfp64: 55, signal: HW_LATCH_RB,    function: GPIO,      af: GPIO,   dir: in,  alt: {function: TIM8_BKIN, af: AF4, polarity: "break when LOW"}, note: "Tap on RUN_12V (R117/R118; RUN_12V = CHAIN_END through K1 pole B): HIGH = chain live AND K1 closed, not the K1 armature. Also U9.B (nSLEEP gate): configured as TIM8_BKIN (AF4, input-only function, active low, automatic output re-enable), never an output, NO internal pull (review M2/M3); configuration read back every 100 ms (PIN_CONFIG). UNVERIFIED: AF mode leaves the output driver off for an input-only function."}
  - {pin: PC14, lqfp64: 3,  signal: BRAKE_L_RB,     function: GPIO,      af: GPIO,   dir: in,  note: "Left brake relay K2 (G2RL-2): HIGH = at least one motor terminal connected to the bridge, LOW = both poles measured isolated (motor on the 1.0 Ohm brake resistor). Measured on the power contacts (motor bias + two comparators on OUT1/OUT2, OR over both poles); VALID ONLY WHILE THE BRIDGES SLEEP (CCR-E03 e): firmware ignores it while nSLEEP is high and keeps the bridges asleep after arming until both relays read HIGH. Backup-domain pin: input only, no load."}
  - {pin: PC15, lqfp64: 4,  signal: BRAKE_R_RB,     function: GPIO,      af: GPIO,   dir: in,  note: "Right brake relay, as above."}
  - {pin: PC13, lqfp64: 2,  signal: WDG_OK_RB,      function: GPIO,      af: GPIO,   dir: in,  note: "Tap on chain node CH_N9 (after U23 WDG_OK): HIGH = chain live up to and including WDG_OK (CCR-E03 d). Low also when any upstream element is open."}
  - {pin: PC12, lqfp64: 54, signal: J2_PRES_RB,     function: GPIO,      af: GPIO,   dir: in,  note: "J2 pin 7 (linked to BUS_GND in the head plug) through a comparator/inverter: HIGH = J2 mated. 1 ms sampling + EXTI12 both edges so a sub-millisecond bounce still latches an event."}

  # --- branch enables that must be OFF with the MCU in reset
  - {pin: PB14, lqfp64: 36, signal: HEAD_HTR_EN,    function: GPIO,      af: GPIO,   dir: out, reset_state: "low via 10k pull-down (off)", note: "J1 3/4 heater branch eFuse U17 enable (TPS259470). Stage 2: limit 3343/845 = 3.96 A nominal (3.56-4.35 A, R46 845 Ohm, S2-04); J1 lands on J_HEAD1 = Mini-Fit Jr 2x5 RA 39-30-1100, pins 1-8 = J1 1-8, 9/10 NC (S2-02, AWG 18 heater pair). Forced off in hardware while the charge inlet is live and while the watchdog is not satisfied."}
  - {pin: PB15, lqfp64: 37, signal: CHS_HTR_EN,     function: GPIO,      af: GPIO,   dir: out, reset_state: "low via 10k pull-down (off)", note: "Chassis/bay heater eFuse enable; slow PWM (1 s period) from the heater regulator. An independent thermal cut-out in series with the heater is required (not firmware)."}

  # --- panel
  - {pin: PB2,  lqfp64: 26, signal: BUZZER,         function: TIM5_CH1,  af: AF2,    dir: out, reset_state: "low via 10k pull-down (silent)", note: "Pre-motion alert. Low-side FET to a self-oscillating buzzer (GPIO level) or piezo (PWM tone on TIM5_CH1)."}

  # --- debug / boot / clock / USB
  - {pin: PC10, lqfp64: 52, signal: DBG_TX,         function: USART3_TX, af: AF7,    dir: out, note: "Debug console 115200 8N1, 3.3 V, 3-pin header + GND."}
  - {pin: PC11, lqfp64: 53, signal: DBG_RX,         function: USART3_RX, af: AF7,    dir: in,  note: "10k pull-up."}
  - {pin: PA11, lqfp64: 45, signal: USB_DM,         function: USB_DM,    af: ANALOG, dir: bidir, note: "USB FS device to the CM5 carrier. ESD array at connector. No external pull-up (internal DP pull-up)."}
  - {pin: PA12, lqfp64: 46, signal: USB_DP,         function: USB_DP,    af: ANALOG, dir: bidir, note: ""}
  - {pin: PA13, lqfp64: 49, signal: SWDIO,          function: SYS_JTMS-SWDIO, af: AF0, dir: bidir, note: "10-pin 1.27 mm Cortex debug header (SWDIO, SWCLK, SWO, NRST, 3V3, GND)."}
  - {pin: PA14, lqfp64: 50, signal: SWCLK,          function: SYS_JTCK-SWCLK, af: AF0, dir: in,  note: ""}
  - {pin: PB3,  lqfp64: 56, signal: SWO_SPARE,      function: SYS_JTDO-SWO, af: AF0, dir: out, note: "SWO trace by default. Spare GPIO on a test point; solder-jumper option to IOX_A INTA/INTB (interrupt-on-change) if polling is ever judged insufficient."}
  - {pin: PB8,  lqfp64: 61, signal: BOOT0_LED_STAT, function: GPIO,      af: GPIO,   dir: out, reset_state: "low via status LED + 1k to GND (BOOT0 = 0)", note: "BOOT0 sampled at reset: DFU push-button to 3V3 through 1k forces the ROM bootloader (USB DFU). After boot: heartbeat LED, active high. UNVERIFIED: ROM bootloader USB DFU on PA11/PA12 for STM32G474 and its clock requirements - check AN2606 before relying on DFU."}
  - {pin: PF0,  lqfp64: 5,  signal: OSC_IN,         function: RCC_OSC_IN,  af: ANALOG, dir: in,  note: "HSE crystal."}
  - {pin: PF1,  lqfp64: 6,  signal: OSC_OUT,        function: RCC_OSC_OUT, af: ANALOG, dir: out, note: ""}

not_io:
  - {pin: PG10-NRST, lqfp64: 7, signal: NRST, note: "100 nF, reset button, debug header. Must NOT reset IOX_B (V5_CM5 / LiDAR enables hold across MCU resets)."}
  - {pin: VBAT, lqfp64: 1, signal: 3V3, note: "No backup cell; boot_id and reset log do not depend on RTC."}

# ----------------------------------------------------------------------------- expander decision
expanders:
  decision: >
    51 I/O are fully used by timing-critical and safety-relevant signals (PWM, encoders, analog,
    E-stop poles, latch, brake relays, watchdog, ARM_PERMIT, presence). The remaining ~40 slow
    signals go to three small expanders. (1) IOX_A, a 16-bit SPI expander on the IMU SPI bus, read
    in full every 1 ms inside the 1 kHz tick (4-byte transfer, ~10 us at 4 MHz): the other chain
    readbacks and buttons, so event latching keeps the same 1 kHz timing as native pins. SPI is
    chosen over I2C for these because the transfer time is bounded and cannot be stretched by
    another device. (2) IOX_B, 16-bit I2C, outputs only: annunciators and sticky power enables.
    (3) IOX_C, 8-bit I2C, inputs only: eFuse faults and alerts. None of the expanders is in the
    hardwired chain; they only observe it. Loss of IOX_A is detected (dynamic sentinel + register
    read-back) and treated as HW_INHIBIT/MCU_NOT_READY with ARM_PERMIT low.
  IOX_A:
    part: "MCP23S17 class (16-bit, SPI, 10 MHz)"
    bus: SPI1
    cs: PB0
    unverified: "MCP23S17 register map and HAEN address behaviour recalled from memory; driver in port/stm32g474 is marked UNVERIFIED until checked against the datasheet."
    read_period_ms: 1
    all_inputs: true
    pins:
      # chain readbacks are NODE taps (CCR-E03 d): HIGH = chain live up to and including that element
      GPA0: {signal: MODE_RUN_RB,       note: "Node CH_N1: selector in RUN = HIGH"}
      GPA1: {signal: HANDS_ON_RB,       note: "Node CH_N3: live through HANDS-ON (not pressed)"}
      GPA2: {signal: CHG_COVER_RB,      note: "Node CH_N4A: live through the inlet cover switch (shut)"}
      GPA3: {signal: CHG_PLUG_LINK_RB,  note: "Node CH_N4: live through U20 (plug link absent and inlet dead)"}
      GPA4: {signal: HEAD_DOCK_RB,      note: "Node CH_N5: live through the dock switch"}
      GPA5: {signal: HEAD_LOOP_OK_RB,   note: "Comparator U30 output (drives U21): loop 0.59-1.55 kOhm = HIGH. Not a node; CH_N6/CH_N7 have test points only"}
      GPA6: {signal: HEAD_LOOP_SHORT_RB, note: "Comparator U32A (diverse from U30): loop below window (short) = HIGH"}
      GPA7: {signal: LAB_KEY_N_RB,      note: "Comparator U31 output (drives U22): PRES_ID 3.92-5.64 kOhm (head, no LAB resistor) = HIGH"}
      GPB0: {signal: BODY_BUMPER_L_RB,  note: "Node CH_N8A (after U21, U22 and J_BUMP_L); known only while CH_N5 is live and GPA5/GPA7 are HIGH"}
      GPB1: {signal: BODY_BUMPER_R_RB,  note: "Node CH_N8 (after J_BUMP_R, rear-right corner since stage 2)"}
      GPB2: {signal: REARM_BTN,         note: "Local REARM/Start pressed = HIGH (second, isolated contact of the button or opto across the set path; the first contact is in the latch set path)"}
      GPB3: {signal: PAUSE_BTN,         note: "Local PAUSE/Stop pressed = HIGH. Stage 2 (S2-01): button on its own connector J_PAUSE (JST GH 5-way, rear-right): pin 1 PAUSE_3V3 (own 1 kOhm supply R_PAUSE), pin 2 PAUSE_BTN_RAW -> R131 -> here, pin 3 V12_AUX lamp +, pin 4 LAMP_PAUSE_K (Q56 from IOX_B P06); ESD D_PAUSE. J_BTN pins 5/8 no longer used"}
      GPB4: {signal: DRV_L_NFAULT,      note: "LOW = left bridge fault (open drain, 10k pull-up)"}
      GPB5: {signal: DRV_R_NFAULT,      note: "LOW = right bridge fault"}
      GPB6: {signal: BUS_CLAMP_ACTIVE,  note: "Brake chopper / bus clamp conducting = HIGH"}
      GPB7: {signal: SENTINEL,          note: "Wired to the WDG_STROBE net (PB11): firmware checks that this bit follows the strobe it generates, which proves the expander read path is live."}
  IOX_B:
    part: "TCA9535 (U44, TCA9535PWR)"
    bus: I2C_SYS
    address_7bit: 0x20
    unverified: "Register map recalled from memory (input 0x00/0x01, output 0x02/0x03, configuration 0x06/0x07, 1 = input). Address 0x20 from the netlist (A0-A2 = GND)."
    reset: "Power-on reset only (not MCU NRST). All pins power up as inputs: each enable has the pull resistor giving its safe default."
    pins:
      P00: {signal: LED_READY,        dir: out, note: "Annunciator, active high via driver"}
      P01: {signal: LED_MOVING,       dir: out}
      P02: {signal: LED_HOLD,         dir: out}
      P03: {signal: LED_FAULT,        dir: out, note: "Additionally OR-ed in hardware with NOT WDG_OK so a dead MCU shows FAULT"}
      P04: {signal: LED_CHARGE,       dir: out}
      P05: {signal: LAMP_REARM,       dir: out, note: "REARM button illumination"}
      P06: {signal: LAMP_PAUSE,       dir: out, note: "Q56 low side -> J_PAUSE pin 4 (stage 2)"}
      P07: {signal: LED_STAT2,        dir: out, note: "Second on-board status LED (protocol activity)"}
      P10: {signal: HEAD_PWR_EN,      dir: out, default: "off (pull-down)", note: "J1 1/2 (J_HEAD1 1/2) eFuse U16 enable, 1.5 A. Forced off by firmware in SERVICE_CHARGE and in hardware while the charge inlet is live."}
      P11: {signal: V12_LIDAR_EN,     dir: out, default: "on (pull-up)", note: "Holds across MCU reset"}
      P12: {signal: V5_CM5_OFF_REQ,   dir: out, default: "not asserted (pull-down) = rail ON", note: "Only asserted for a deliberate compute power cycle; the 5 V rail stays up across MCU resets and with the MCU unprogrammed."}
      P13: {signal: TOF_XSHUT_CLIFF,  dir: out, default: "low (sensors held in reset)", note: "Shared XSHUT of the 4 cliff sensors"}
      P14: {signal: TOF_XSHUT_LOOK,   dir: out, default: "low", note: "Shared XSHUT of the 4 look-ahead sensors"}
      P15: {signal: TOF_XSHUT_REAR,   dir: out, default: "low", note: "Shared XSHUT of the 3 rear sensors"}
      P16: {signal: TOF_MUX_NRST,     dir: out, default: "low", note: "Reset of both TCA9548A (bus recovery)"}
      P17: {signal: CHAIN_END_RB,     dir: in, note: "INPUT, never driven (CCR-E02, IB-01): tap on node CHAIN_END after the ARM_PERMIT photo-MOS U24 (100k/56k, BAT54 clamp). HIGH = whole chain live except E-stop pole B. Read at 100 Hz; compared with the ARM_PERMIT output (PERMIT_STUCK_ON / PERMIT_STUCK_OFF)."}
  IOX_C:
    part: "TCA9534 / PCA9534 class (8-bit, I2C)"
    bus: I2C_SYS
    address_7bit: 0x21
    unverified: "Address strapping recalled from memory."
    pins:
      P0: {signal: HEAD_PWR_NFLT,   note: "LOW = eFuse fault/tripped"}
      P1: {signal: HEAD_HTR_NFLT}
      P2: {signal: CHS_HTR_NFLT}
      P3: {signal: V12_LIDAR_NFLT}
      P4: {signal: V5_CM5_NFLT}
      P5: {signal: CHG_NSMBALERT,   note: "Charger alert"}
      P6: {signal: PMON_NALERT,     note: "Pack monitor alert"}
      P7: {signal: V5_PGOOD}

  IOX_D:
    part: "TCA9534 (U47, TCA9534PWR) - stage 3 S3-F1"
    bus: I2C_SYS
    address_7bit: 0x22
    unverified: "Register map recalled (input 0x00, configuration 0x03, 1 = input; power-on all inputs). Address 0x22 from the netlist (A0 = GND, A1 = 3V3, A2 = GND)."
    note: "All pins inputs; the configuration register is never written (only read back: must be 0xFF). Read at 100 Hz; every read checks the fixed pattern P4..P7 = 1,0,0,0 ((in & 0xF0) == 0x10). Unknown -> no arming; while latched a sample up to 50 ms old is used (m7 rule)."
    pins:
      P0: {signal: LATCH_NC_RB,      note: "Tap on K1 pole A NC (K1_SEAL_A biased from 3V3): HIGH = K1 pole A released, valid with the chain dead. LOW with HW_LATCH_RB low > 30 ms -> K1_WELD"}
      P1: {signal: LATCH_RUN_RB,     note: "Tap on K1_RUN (K1 pole B output, before U_HOLD): HIGH = CHAIN_END live AND K1 pole B closed. HIGH with HW_LATCH_RB low -> K1_WELD; HW_LATCH_RB high with this low -> RUN_SHORT"}
      P2: {signal: HEAD_LOOP2_OK_RB, note: "Head-loop channel B (U46 TLV3201, drives U21B between CH_N6A and CH_N6): HIGH = loop closed (< 2.70 kOhm); detects open only"}
      P3: {signal: REARM_SET_RB,     note: "REARM set contact (J_BTN 1-2, 5 V signal into the on-board edge-triggered set stage): HIGH = closed. Must agree with REARM_BTN (aux) within 200 ms"}
      P4: {signal: IOXD_P4,          note: "tied to 3V3: reads 1 (pattern)"}
      P5: {signal: IOXD_P5,          note: "tied to GND: reads 0 (pattern)"}
      P6: {signal: IOXD_P6,          note: "tied to GND: reads 0"}
      P7: {signal: IOXD_P7,          note: "tied to GND: reads 0"}

# ----------------------------------------------------------------------------- I2C device map
i2c:
  I2C_SYS:
    speed_hz: 400000
    devices:
      - {ref: CHARGER,  part: "LTC4162-FAD (U3)", address_7bit: 0x68, unverified: "address, register map and cell-count strap UNVERIFIED (IB-06: analog.com not reachable from the build machine, fetch retried 2026-11-27 and failed). The driver is disabled (RR_LTC4162_REGMAP_VERIFIED 0); charge inhibit (+5 C NTC, JEITA) is hardware and does not depend on firmware."}
      - {ref: PMON,     part: "INA228 (U2, INA228AIDGSR)", address_7bit: 0x40, verified: "TI SLYS021A Table 7-2 (A1 = A0 = GND -> 1000000b) and Table 7-3 register map, read 2026-11-27", note: "Pack side: R_SH1 1 mOhm between VBAT_PROT (IN+, through R9) and VBAT_SW (IN-, R10), so + = discharge; VBUS = VBAT_SW. ADCRANGE 1 (+-40.96 mV = +-41 A)."}
      - {ref: BRANCH,   part: "INA3221 (U15, INA3221AIRGVR)", address_7bit: 0x41, verified: "TI SBOS576C Table 7-1 (A0 = VS -> 1000001b) and Table 8-1 register map, read 2026-11-27", note: "IN+ of all channels on VBAT_SW; ch1 HEAD_PWR R_SH2 20 mOhm, ch2 HEAD_HTR R_SH3 5 mOhm, ch3 CHS_HTR R_SH4 5 mOhm (STATE rails.i_head_a, i_head_htr_a, i_chs_htr_a). 40 uV shunt LSB -> 2 mA / 8 mA / 8 mA."}
      - {ref: IOX_B,    address_7bit: 0x20}
      - {ref: IOX_C,    address_7bit: 0x21}
      - {ref: IOX_D,    address_7bit: 0x22}
  I2C_TOF:
    speed_hz: 400000
    devices:
      - {ref: TOF_MUX0, part: TCA9548A, address_7bit: 0x70, unverified: "address range 0x70-0x77 recalled from memory"}
      - {ref: TOF_MUX1, part: TCA9548A, address_7bit: 0x71}
      - {ref: "TOF x11", part: VL53L4ED, address_7bit: 0x29, unverified: "default address recalled from memory; never re-addressed (mux isolates)"}
    mux_channels:        # index = firmware tof id (order used by STATE.tof[] and the emulator)
      0:  {id: CLIFF_FL, mux: 0, ch: 0, xshut: TOF_XSHUT_CLIFF, connector: J_TOF0, role: "downward cliff, front-left wheel/head corner"}
      1:  {id: CLIFF_FR, mux: 1, ch: 0, xshut: TOF_XSHUT_CLIFF, connector: J_TOF1, role: "downward cliff, front-right"}
      2:  {id: CLIFF_RL, mux: 0, ch: 1, xshut: TOF_XSHUT_CLIFF, connector: J_TOF2, role: "downward cliff, rear-left"}
      3:  {id: CLIFF_RR, mux: 1, ch: 1, xshut: TOF_XSHUT_CLIFF, connector: J_TOF3, role: "downward cliff, rear-right"}
      4:  {id: LOOK_FL,  mux: 0, ch: 2, xshut: TOF_XSHUT_LOOK,  connector: J_TOF4, frame: tof_look_fwd_left,  role: "oblique, forward over the head from the left grip cheek; guards forward travel (pair partner LOOK_FR on mux 1)"}
      5:  {id: LOOK_RL,  mux: 1, ch: 2, xshut: TOF_XSHUT_LOOK,  connector: J_TOF5, frame: tof_look_rev_left,  role: "oblique, rearward from the tail, left; guards reverse travel (pair partner LOOK_RR on mux 0)"}
      6:  {id: LOOK_RR,  mux: 0, ch: 3, xshut: TOF_XSHUT_LOOK,  connector: J_TOF6, frame: tof_look_rev_right, role: "oblique, rearward from the tail, right"}
      7:  {id: LOOK_FR,  mux: 1, ch: 3, xshut: TOF_XSHUT_LOOK,  connector: J_TOF7, frame: tof_look_fwd_right, role: "oblique, forward over the head from the right grip cheek"}
      8:  {id: REAR_L,   mux: 0, ch: 4, xshut: TOF_XSHUT_REAR, connector: J_TOF8,  role: "rear proximity left"}
      9:  {id: REAR_C,   mux: 1, ch: 4, xshut: TOF_XSHUT_REAR, connector: J_TOF9,  role: "rear proximity centre"}
      10: {id: REAR_R,   mux: 0, ch: 5, xshut: TOF_XSHUT_REAR, connector: J_TOF10,  role: "rear proximity right"}
    note: "IB-34 (lead decision, corrected mapping 2026-11-27): forward pair LOOK_FL (mux 0) / LOOK_FR (mux 1), rear pair LOOK_RL (mux 1) / LOOK_RR (mux 0): one dead mux leaves one sensor of every pair; firmware still stops on any stale sensor in the direction of travel (no degraded running). Connector -> mux channel cross-checked against the netlist export by tools/check_pinmap.py."

# ----------------------------------------------------------------------------- requests to the electronics lead
hardware_requests:
  - "ARM_PERMIT 4.7k pull-down; chain must be open with the MCU in reset, in the ROM bootloader (BOOT0 button) and unprogrammed."
  - "DRV_NSLEEP AND-gated with HW_LATCH in hardware; PWM pins pulled low."
  - "HW_LATCH_RB on PD2 so TIM8 break can be used."
  - "Readback polarity as listed (HIGH = healthy) with pull-downs, so an open readback wire reads unhealthy."
  - "IOX_B reset from the 3.3 V supervisor only, not from NRST."
  - "LED_FAULT OR-ed with NOT WDG_OK in hardware; HANDS-ON lamp driven from the real chain node (contract)."
  - "Test points on WDG_STROBE, WDG_OK, ARM_PERMIT, HW_LATCH_RB, VMOT_SENSE, both IPROPI, SPI1, both I2C buses."
  - "HEAD_PRES_ID pull-up 4.70 kOhm 0.1 % to VREF+ (firmware constant RR_PRES_PULLUP_OHM); if a different value is fitted, change the constant, not the windows."
  - "Adopted in rev A (stage 2): CHAIN_END_RB on IOX_B P17 (CCR-E02), watchdog to NRST through JP1 (CCR-E11), nSLEEP AND gate U9, readback polarity as above."
  - "External independent thermal cut-out for the chassis heater; firmware heater control is default-off but is not the protection."
