; Rad Roomba chassis firmware - STM32G474RET6 target (RR-CHS-MAIN; a NUCLEO-G474RE runs the
; same image for bench bring-up of the protocol). Pinned toolchain: PlatformIO Core 6.x,
; platform ststm32 20.0.0, GCC arm-none-eabi 12.3.1 (toolchain-gccarmnoneeabi 1.120301.0),
; STM32CubeG4 HAL + USB device library 1.6.3. NOT TESTED ON HARDWARE.
[platformio]
src_dir = src
include_dir = include

[common]
build_flags =
    -I../../core
    -I../../../common/include
    -DRRCH_FW_SUFFIX=\"+stm32g474\"
    -std=gnu11 -Wall -Wextra -Wno-unused-parameter

[env]
platform = ststm32@20.0.0
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.120301.0
    platformio/framework-stm32cubeg4@1.6.3
board = nucleo_g474re
framework = stm32cube
build_src_filter =
    +<*>
    +<../../../core/*.c>
    +<../../../../common/src/*.c>
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
extra_scripts = pre:fpu.py

; RR-CHS-MAIN with an 8 MHz crystal
[env:rr_chs_main]
build_flags = ${common.build_flags} -DRR_HSE_HZ=8000000 -DHSE_VALUE=8000000UL

; 24 MHz crystal (RR-CHS-MAIN option; also the X3 crystal of a NUCLEO-G474RE used for protocol bring-up)
[env:rr_chs_main_24mhz]
build_flags = ${common.build_flags} -DRR_HSE_HZ=24000000 -DHSE_VALUE=24000000UL
