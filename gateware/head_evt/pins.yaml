# Rad Roomba head event logic - FPGA pin list (proposal to the head electronics lead)
# Device: Lattice iCE40UP5K-SG48 (QFN48, 39 user I/O). `make gen` turns this file into pins.pcf.
#
# Evidence for each entry (field `check`):
#   tool   = pin number exists as a user I/O in the icestorm sg48 package database AND nextpnr-ice40 0.6 placed and
#            routed the design with this assignment (see build_out/head_evt.pnr.log). "global" notes are from the
#            icestorm padin_pio database (pins 20, 23, 35, 37, 41, 44 can drive a global buffer).
#   memory = from the engineer's recollection of the Lattice pinout table / TN (site names, bank numbers, configuration
#            functions). UNVERIFIED against the datasheet in this work package: the electronics lead must check them
#            against the iCE40 UltraPlus Family Data Sheet pinout before layout.
# Nothing here is physically measured.
device: iCE40UP5K
package: SG48
user_io_available: 39
io_standard_default: "LVCMOS33 (SB_LVCMOS), all three VCCIO rails at the MCU's 3.3 V"
general_notes:
  - "All 20 comparator inputs go straight to an asynchronous set latch inside the FPGA: route them as clean, monotonic CMOS edges (push-pull comparator outputs, series 22-33 ohm at the comparator). A runt or ringing edge is a counted event."
  - "iCE40 I/O have no internal pull-down. Before configuration (and while CRESET_B is low) user I/O are high-Z with weak pull-ups (memory, UNVERIFIED): PULSER, HTR_SYNC, TRIG_OUT, IRQ and GATE_SYNC need an external pull-down (10 k) so the heater is off and the injector quiet until the bitstream runs. HTR_STATE and SYNC_IN need an external pull-down if their source can be absent (DNP RS-422 receiver)."
  - "The SPI pins are the slave-configuration pins. Reuse as user I/O after CDONE is the documented iCE40 behaviour (memory of Lattice TN 'iCE40 Programming and Configuration'; UNVERIFIED here) and the same pins are plain user I/O in the icestorm database (tool). Conditions the board/firmware must meet: SPI_SS low at the rising edge of CRESET_B selects slave configuration; the MCU must send at least 49 extra SCK cycles after CDONE goes high before the user design owns the pins; the bus must be dedicated to the FPGA (no other slave on these four nets)."
  - "The LED is on RGB0, an open-drain pin: LED from 3.3 V through a resistor to the pin, lit when the pin is low. It can be left unfitted or disabled by register (LED_CFG) to keep switching current out of the head."

pins:
  # ---- clock
  - {signal: CLK_24M, port: clk_24m, pin: 35, site: IOT_46b_G0, bank: 0, dir: in, check: tool,
     notes: "24 MHz from the TCXO shared with the MCU. Global buffer input and the PLL reference pad (SB_PLL40_PAD): must be this pin. Needs a full-swing CMOS clock; a clipped-sine TCXO needs a buffer/squarer."}
  # ---- configuration (dedicated, not user I/O)
  - {signal: CRESET_B, port: null, pin: 8, site: CRESET_B, bank: 1, dir: in, check: memory,
     notes: "UNVERIFIED pin number. Driven by the MCU; low = FPGA reset, all user I/O high-Z."}
  - {signal: CDONE, port: null, pin: 7, site: CDONE, bank: 1, dir: out, check: memory,
     notes: "UNVERIFIED pin number. Open-drain, external pull-up; read by the MCU."}
  # ---- SPI (configuration port reused as the register interface)
  - {signal: SPI_SCK, port: spi_sck, pin: 15, site: IOB_34a_SPI_SCK, bank: 1, dir: in, check: tool,
     notes: "MCU SCK. <= 4 MHz for the register interface (configuration may run faster)."}
  - {signal: SPI_SS, port: spi_cs_n, pin: 16, site: IOB_35b_SPI_SS, bank: 1, dir: in, check: tool,
     notes: "MCU chip select, active low. Must be low when CRESET_B is released (slave configuration)."}
  - {signal: SPI_SI, port: spi_mosi, pin: 17, site: IOB_33b_SPI_SI, bank: 1, dir: in, check: tool,
     notes: "MCU MOSI -> FPGA. Configuration data input in slave mode (site name from memory, UNVERIFIED)."}
  - {signal: SPI_SO, port: spi_miso, pin: 14, site: IOB_32a_SPI_SO, bank: 1, dir: out, check: tool,
     notes: "FPGA -> MCU MISO. Tri-state, driven only while SPI_SS is low and the design is running. Unused during slave configuration."}
  # ---- MCU-facing signals
  - {signal: IRQ, port: irq, pin: 18, site: IOB_31b, bank: 1, dir: out, check: tool,
     notes: "Level, active high: gate record ready (and optional sources, IRQ_EN). MCU EXTI."}
  - {signal: TRIG_OUT, port: trig_out, pin: 19, site: IOB_29b, bank: 1, dir: out, check: tool,
     notes: "Active-high pulse (TRIG_CFG.WIDTH ticks) on a selected event; MCU timer/ADC external trigger for waveform capture."}
  - {signal: HTR_STATE, port: htr_state, pin: 20, site: IOB_25b_G3, bank: 1, dir: in, check: tool,
     notes: "Actual heater switch state (high = heater conducting), e.g. the gate-drive net after the thermal cut-out logic. Global-capable pin used as an ordinary input. External pull-down."}
  - {signal: HTR_SYNC, port: htr_sync, pin: 21, site: IOB_23b, bank: 1, dir: out, check: tool,
     notes: "Heater enable retimed to gate boundaries (HTR_CTRL.ON). Active high. External pull-down; the hardware over-temperature cut-out must stay in series and independent of this pin."}
  - {signal: SYNC_IN, port: sync_in, pin: 13, site: IOB_24a, bank: 1, dir: in, check: tool,
     notes: "Reserved hardware time pulse (J2 pins 5/6 through a DNP RS-422 receiver). Rising edge is timestamped. External pull-down. Bank number UNVERIFIED."}
  - {signal: PULSER, port: pulser, pin: 12, site: IOB_22a, bank: 1, dir: out, check: tool,
     notes: "Test-pulse strobe to the analog charge injector, active high, >= 1 tick wide. External pull-down. Bank number UNVERIFIED."}
  - {signal: GATE_SYNC, port: gate_sync, pin: 11, site: IOB_20a, bank: 1, dir: out, check: tool,
     notes: "Toggles on the first tick of every gate (test point / MCU timer capture: proves equal gate boundaries with a scope). Bank number UNVERIFIED."}
  - {signal: LED_N, port: led_n, pin: 39, site: RGB0, bank: 0, dir: out, check: tool,
     notes: "Status LED, open-drain, active low."}
  # ---- comparator inputs, lane 0 (segment 0, robot left)
  - {signal: F0_BETA_LLD, port: "beta_lld[0]", pin: 23, site: IOT_37a, bank: 0, dir: in, check: tool, notes: "Floor lane 0 fast path, low threshold. Global-capable pin used as an ordinary input."}
  - {signal: F0_BETA_ULD, port: "beta_uld[0]", pin: 25, site: IOT_36b, bank: 0, dir: in, check: tool, notes: "Floor lane 0 fast path, high threshold."}
  - {signal: F0_ALPHA,    port: "alpha[0]",    pin: 26, site: IOT_39a, bank: 0, dir: in, check: tool, notes: "Floor lane 0 slow path threshold."}
  - {signal: R0_REF_LLD,  port: "ref_lld[0]",  pin: 27, site: IOT_38b, bank: 0, dir: in, check: tool, notes: "Reference lane 0 low threshold."}
  - {signal: R0_REF_ULD,  port: "ref_uld[0]",  pin: 28, site: IOT_41a, bank: 0, dir: in, check: tool, notes: "Reference lane 0 high threshold."}
  # ---- lane 1
  - {signal: F1_BETA_LLD, port: "beta_lld[1]", pin: 31, site: IOT_42b, bank: 0, dir: in, check: tool, notes: ""}
  - {signal: F1_BETA_ULD, port: "beta_uld[1]", pin: 32, site: IOT_43a, bank: 0, dir: in, check: tool, notes: ""}
  - {signal: F1_ALPHA,    port: "alpha[1]",    pin: 34, site: IOT_44b, bank: 0, dir: in, check: tool, notes: ""}
  - {signal: R1_REF_LLD,  port: "ref_lld[1]",  pin: 36, site: IOT_48b, bank: 0, dir: in, check: tool, notes: ""}
  - {signal: R1_REF_ULD,  port: "ref_uld[1]",  pin: 37, site: IOT_45a_G1, bank: 0, dir: in, check: tool, notes: "Global-capable pin used as an ordinary input."}
  # ---- lane 2
  - {signal: F2_BETA_LLD, port: "beta_lld[2]", pin: 38, site: IOT_50b, bank: 0, dir: in, check: tool, notes: ""}
  - {signal: F2_BETA_ULD, port: "beta_uld[2]", pin: 42, site: IOT_51a, bank: 0, dir: in, check: tool, notes: ""}
  - {signal: F2_ALPHA,    port: "alpha[2]",    pin: 43, site: IOT_49a, bank: 0, dir: in, check: tool, notes: ""}
  - {signal: R2_REF_LLD,  port: "ref_lld[2]",  pin: 44, site: IOB_3b_G6, bank: 2, dir: in, check: tool, notes: "Global-capable pin used as an ordinary input."}
  - {signal: R2_REF_ULD,  port: "ref_uld[2]",  pin: 45, site: IOB_5b, bank: 2, dir: in, check: tool, notes: ""}
  # ---- lane 3 (segment 3, robot right)
  - {signal: F3_BETA_LLD, port: "beta_lld[3]", pin: 46, site: IOB_0a, bank: 2, dir: in, check: tool, notes: ""}
  - {signal: F3_BETA_ULD, port: "beta_uld[3]", pin: 47, site: IOB_2a, bank: 2, dir: in, check: tool, notes: ""}
  - {signal: F3_ALPHA,    port: "alpha[3]",    pin: 48, site: IOB_4a, bank: 2, dir: in, check: tool, notes: ""}
  - {signal: R3_REF_LLD,  port: "ref_lld[3]",  pin: 2,  site: IOB_6a, bank: 2, dir: in, check: tool, notes: ""}
  - {signal: R3_REF_ULD,  port: "ref_uld[3]",  pin: 3,  site: IOB_9b, bank: 2, dir: in, check: tool, notes: ""}

spare_user_io:
  - {pin: 4,  site: IOB_8a,  bank: 2, notes: "spare"}
  - {pin: 6,  site: IOB_13b, bank: 2, notes: "spare; bank number UNVERIFIED"}
  - {pin: 9,  site: IOB_16a, bank: 1, notes: "spare; bank number UNVERIFIED"}
  - {pin: 10, site: IOB_18a, bank: 1, notes: "spare; bank number UNVERIFIED"}
  - {pin: 40, site: RGB1,    bank: 0, notes: "spare, open-drain only"}
  - {pin: 41, site: RGB2,    bank: 0, notes: "spare, open-drain only; global-capable"}

power_pins_memory:      # UNVERIFIED, for the schematic reviewer only; not used by the build
  - {pin: 1,  name: VCCIO_2}
  - {pin: 5,  name: VCC}
  - {pin: 22, name: SPI_VCCIO1}
  - {pin: 24, name: VPP_2V5}
  - {pin: 29, name: VCCPLL}
  - {pin: 30, name: VCC}
