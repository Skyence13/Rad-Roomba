timing:
  head_gate_us_default: 100000
  head_buffer_frames_min: 128
  head_link_baud: 1000000
  head_clock: 64-bit microseconds, monotonic since head MCU boot, derived from the head 24 MHz TCXO
  chassis_clock: 64-bit microseconds, monotonic since chassis MCU boot
  host_clock: CLOCK_MONOTONIC on the CM5 (ROS steady time); ROS stamps use system time derived from it
    once per boot epoch
  sync_method: Host-mediated four-timestamp exchange (TIME op) on both links, linear fit host = offset
    + drift*device, bound = half round-trip + asymmetry allowance + drift*age.
  max_time_bound_us_for_mapping: 10000
  target_time_bound_us: 2000
  sync_refresh_period_s: 2.0
  sync_expiry_s: 10.0
  head_holdover_rule: After expiry the head reports HOLDOVER with the bound growing at 200 ppm, and UNSYNCED
    60 s after expiry (CR-H5; compile-time constants in firmware/head/core/rrh_config.h).
  reserved_hw_sync: J2 pins 5/6 reserved for a future RS-422 hardware time pulse (not fitted in rev A
    boards; footprints DNP).
survey_methods:
  terms: Ratemeter = sliding-window count rate evaluated every gate while moving (window default = aperture
    transit time L/v). Scaler count = counts and live time accumulated with the robot verified stationary
    for a preset live time, or adaptively until a decision is reached (D# <= goal, or net result clear
    of the decision threshold) up to a maximum time.
  SEARCH_THEN_COUNT:
    desc: Ratemeter search at survey speed for hot spots, then park the flagged lane over the spot and
      take a scaler count. The search alarm is deliberately sensitive; the scaler count makes the reported
      decision.
    params:
      search_speed_mps: 0.1
      ratemeter_window_s: 1.0
      count_policy:
      - INLINE
      - DEFERRED
      scaler_mode:
      - PRESET_TIME
      - ADAPTIVE
      scaler_preset_s: 30
      scaler_max_s: 100
    notes: INLINE stops at once, reverses to centre the alarming lane on the peak and counts. DEFERRED
      queues the spots and visits them after the pass or after the scan (same motion as a guided revisit).
      Floor that only saw the search stage is reported at the search-stage detection limit.
  STEP_AND_COUNT:
    desc: 'Scaler survey of the whole floor: move one station, stop, count, repeat. Every credited measurement
      is a static count over four defined 80 cm2 apertures.'
    params:
      station_pitch_m: 0.08
      settle_s: 0.5
      scaler_mode:
      - PRESET_TIME
      - ADAPTIVE
      scaler_preset_s: 10
      scaler_max_s: 60
    notes: Station pitch is the aperture length (0.100 m) less twice the position-erosion allowance (2
      x 10 mm), so credited footprints of successive stations abut (robot software CR-05). Counts taken
      while moving between stations are archived and shown as ratemeter data but earn no coverage credit.
      Mission time is hours for a full trailer (see architecture document); expect pack swaps.
  CONTINUOUS_SCAN:
    desc: Constant-speed scan with no stops; speed chosen so the aperture dwell meets the detection goal.
    params:
      speed_mps:
      - 0.02
      - 0.2
  review_queue_policy:
    desc: What enters the review queue (owner decision 2026-11-27). A site-profile setting.
    options:
      ALARM_ONLY: Default. Only cells whose statistic exceeds the decision threshold at the profile's
        scan-stage false-alarm rate (alpha_scan) are queued (and, in SEARCH_THEN_COUNT, trigger the scaler
        count). Cells that do not alarm but whose detection limit is above the profile's detection goal
        are shown on the map as 'sensitivity insufficient' and counted in the residual area; they are
        not queued.
      ALL_UNRESOLVED: Every cell that cannot be cleared at the investigation level is queued (the behaviour
        before this decision).
    default: ALARM_ONLY
  common: All methods record raw gates identically; the method, its parameters and the stage that produced
    each cell's decision are stored with the result. A scaler count is valid only while both wheel encoders
    and the gyro confirm zero motion and no stop/inhibit transition occurred inside it.
