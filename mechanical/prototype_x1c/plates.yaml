schema: rr-plates/1
note: Generated by rrx/docs.py. NOT sliced in this work package (owner slices from the STEP/STL/3MF exports in Bambu Studio); the manifest works with the optional mechanical/tools/slice_plates.py.
printer:
  model: Bambu Lab X1 Carbon
  machine_profile: Bambu Lab X1 Carbon 0.4 nozzle
  bed:
  - 256
  - 256
  - 250
  edge_margin: 3.0
defaults:
  plate_type: Textured PEI Plate
  process: 0.20mm Standard @BBL X1C
  part_gap: 8.0
materials:
  ASA:
    filament_profile: Bambu ASA @BBL X1C 0.4 nozzle
    density_g_cm3: 1.07
    process: 0.20mm Standard @BBL X1C
    plate_type: Textured PEI Plate
    overrides:
      wall_loops: 4
      sparse_infill_density: 20%
      sparse_infill_pattern: gyroid
      brim_type: outer_only
      brim_width: 5
    justification: 'Skins, covers, cassette, trays. UV-stable (outdoor grade), tolerates the wipe-down agents expected (water/detergent, 70 % IPA short contact, dilute hypochlorite; NOT ketones/esters),
      glass transition ~100 C so heat-set inserts and a sun-heated trailer are safe, lower density than PETG-CF. Unfilled, so it keeps some ductility at -25 C (notched impact falls to roughly half of the
      +23 C value: handbook trend, UNVERIFIED for the spool -> drop/impact coupons at -25 C are a first-article test). Needs the closed chamber and a brim on the tall pieces (warp).'
  PAHT-CF:
    filament_profile: Bambu PAHT-CF @BBL X1C
    density_g_cm3: 1.06
    process: 0.20mm Strength @BBL X1C
    plate_type: Textured PEI Plate
    overrides:
      wall_loops: 5
      sparse_infill_density: 35%
      sparse_infill_pattern: gyroid
      brim_type: outer_only
      brim_width: 5
    justification: 'Load-bearing printed parts (motor pods, wheel rims, bulkhead, hatch frame, cassette handle, cliff pods, service cover). Highest stiffness and creep resistance of the stock X1C materials,
      low moisture uptake for a polyamide, keeps strength at -25 C. Carbon-filled: electrically conductive surface -> not used for the cassette or anything touching terminals. Print dry (80 C / 8 h), layer
      adhesion in Z is about half of XY -> every part is oriented so the service load is in-plane.'
  TPU95A:
    filament_profile: Bambu TPU 95A HF @BBL X1C
    density_g_cm3: 1.22
    process: 0.20mm Standard @BBL X1C
    plate_type: Textured PEI Plate
    overrides:
      wall_loops: 4
      sparse_infill_density: 20%
      sparse_infill_pattern: gyroid
    justification: Tyres only. 95A grips painted steel/plywood when warm; it stiffens markedly below about -10 C and approaches its glass transition near -30 C (polyester grades earlier) -> traction and
      compliance at -20/-25 C are NOT assumed, see the wheel caveats in the report.
