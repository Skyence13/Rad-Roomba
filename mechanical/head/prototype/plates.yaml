# Plate manifest for the printed head parts (schema rr-plates/1, see mechanical/tools/README.md). Generated by mechanical/head/export.py.
schema: rr-plates/1
printer:
  model: Bambu Lab X1 Carbon
  machine_profile: Bambu Lab X1 Carbon 0.4 nozzle
  bed:
  - 256
  - 256
  - 250
  exclude_area:
  - 0
  - 0
  - 18
  - 28
  edge_margin: 3.0
defaults:
  plate_type: Textured PEI Plate
  process: 0.20mm Standard @BBL X1C
  part_gap: 6.0
notes:
- 'Not sliced (owner decision: STEP files are imported into Bambu Studio by the owner). Fit is tool-checked by bounding box in the stated orientation (mechanical/head/checks.py,
  8 mm margin each side, 18 x 28 mm exclusion corner avoided by the shelf pack below).'
- Meshes are in print orientation with z = 0 on the bed. qty > 1 parts are packed by the listed positions.
- filament_profile names are the stock Bambu names as used by mechanical/tools; UNVERIFIED against the installed Bambu Studio version.
materials:
  PA-CF:
    filament_profile: Bambu PAHT-CF @BBL X1C
    density_g_cm3: 1.22
    process: 0.20mm Standard @BBL X1C
    plate_type: Textured PEI Plate
    justification: 'PAHT-CF (PA12-based, low moisture uptake): highest dry stiffness of the candidates (E about 5.5 GPa XY), keeps impact strength at -20 C better
      than PETG-CF, creep-resistant under the insert and screw preloads next to the +10 C heater plane, matte black and opaque. Print dry (80 C / 8 h), store dry;
      conditioned modulus about half the dry value -> structure is checked with both. Used for the frame halves and every small structural part.'
  PETG-CF:
    filament_profile: Bambu PETG-CF @BBL X1C
    density_g_cm3: 1.25
    process: 0.20mm Standard @BBL X1C
    plate_type: Textured PEI Plate
    justification: 'Flat, lightly loaded, wipe-down parts (cassettes, lane rings, barrier, covers): dimensionally stable, no drying sensitivity, good chemical resistance
      to decontamination wipes. Lower cold impact strength than PA-CF: not used where a rail or latch load passes. Alternative for the frame if PA-CF warps.'
  ASA:
    filament_profile: Bambu ASA @BBL X1C
    density_g_cm3: 1.07
    process: 0.20mm Standard @BBL X1C
    plate_type: Textured PEI Plate
    justification: 'Not selected for the head: E about 2.2 GPa gives 2.5 x the wall deflection of PA-CF and unfilled ASA is notch-sensitive in the cold. Kept as a
      listed fallback for the transport covers only (UV / wipe resistance).'
  TPU:
    filament_profile: Bambu TPU 95A @BBL X1C
    density_g_cm3: 1.21
    process: 0.20mm Standard @BBL X1C
    plate_type: Textured PEI Plate
    justification: Split strain-relief grommets (95A stays flexible at -20 C; external spool, not through the AMS). A moulded silicone grommet replaces it in production.
plates:
- id: H01
  name: frame_half_left
  material: PA-CF
  kit: head
  overrides:
    wall_loops: 5
    sparse_infill_density: 40%
    enable_support: false
    brim_type: outer_only
  edge_margin: 8.0
  fits_one_plate: true
  parts:
  - part: frame_half_left
    part_number: RR-HD-X-101
    mesh: print/RR-HD-X-101__frame_half_left.stl
    step: print/RR-HD-X-101__frame_half_left.step
    qty: 1
    positions:
    - - 67.0
      - 123.6
    rotation_z: 0
    orientation_note: underside (z 10.5) on the bed; cavity walls, seat shoulder, rib top and wall top are all vertical or upward faces; joint face vertical
    supports: 'optional, non-critical: the rear wall bridges 60 mm over each T-head pocket opening at z 30.0 (tree supports from the pocket floor; the face carries
      no load, the spreader is the seat). Everything else bridges <= 13.5 mm (side switch pocket roof, guide slits, drain channel) or overhangs <= 5 mm (lid boss
      undersides, tongue). Horizontal bores (guide rods 4.3, dowels, bail-block inserts) print as holes and are reamed. No support on the cassette seat (bed face),
      the module seat shoulders, the rib tops, the spreader seat or the joint faces.'
    layer_height: 0.2
    walls: 5
    infill: '40 % gyroid (100 % below z 11 and in the ribs: 4-5 perimeters fill them)'
    brim: 5 mm outer brim (PA-CF warp)
    bbox_print_mm:
    - 118.0
    - 175.2
    - 32.5
    volume_cm3: 79.5
    mesh_open_edges: 0
