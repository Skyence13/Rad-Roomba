# Rad Roomba system interface contract (machine-readable part)
# Owner: integration lead. Change only through the lead; every change gets a
# DEC-xxx entry in planning/decisions.csv and a line in docs/architecture/CHANGELOG.md.
# Human-readable rationale: docs/architecture/SYSTEM_ARCHITECTURE.md
# Units: SI (m, s, rad, V, A, W, kg) unless a key name carries another unit suffix (_mm, _us, _ms, _c).
contract_version: "0.4.0-draft9"   # draft9: head set-point +5 C (owner decision 2026-11-27); head loop evaluated by two channels in series; latch set stage kept on the board (chassis board stage 3)
# previous:   # draft8: thermal_policy added (bay not held at +10 C on pack power; receiver thermal break required)
# previous:   # draft7: tail swept radius 0.290 m (rear bumper included, prototype body CR-09); grip bar moved aft to x = -30 (CR-04); look-ahead ToF set = 2 forward + 2 rearward (IB-34); branch limits reconciled with the stage-2 board (IB-28)
# previous:   # draft6: head envelope extended forward for the sprung leading rail (15.6 mm stroke); head grounding and insulation decisions
# previous:   # draft5: head mount option C adopted (DEC-041 closed): mount datum and optics row moved 72.8 mm aft; 12 Ah layout
# previous:   # draft4: Rev E body adopted (DEC-039), 12 Ah pack (DEC-040), head mount under trade study (DEC-041)
# previous:   # draft3: mechanical CCR-04..07 applied, Rev E body proposal recorded as pending owner decision
# previous:   # draft2: FPGA removed (DEC-037), survey methods added (DEC-038)
baseline: {system_design: "0.3", mechanical: "Rev D", head_protocol: "2.0", baseline_commit: "38d101051d32b47e4b21657e2293ec92c63de9c4"}
next_revision: {system_design: "0.4", mechanical: "Rev E", head_protocol: "2.0 (unchanged envelope; additive descriptor fields only)", chassis_protocol: "1.0"}

# ---------------------------------------------------------------- frames
frames:
  convention: "REP-103/105. x forward (toward head), y left, z up, right-handed."
  cad_units: mm
  ros_units: m
  base_link:
    definition: "On the nominal level floor directly below the midpoint of the drive axle. Identical to the Rev D CAD origin, so CAD(mm)/1000 == base_link(m). No axle-height offset exists anywhere in the software."
  axle_height_mm: 52.0
  wheel:
    nominal_diameter_mm: 104.0
    track_mm: 270.0            # Rev E body (DEC-039); Rev D was 220
    encoder_counts_per_wheel_rev: 9600   # Pololu #2828, quadrature edges at gearbox output
  caster: {swivel_x_mm: -195.0, wheel_x_mm: -204.0, y_mm: 0.0}   # Rev E body (DEC-039); Rev D was -100 / -116
  head_mount_review: "DEC-041 closed 2026-11-26: option C of mechanical/common/out/head_mount_trade_study.md adopted (twin-shoe receiver on the lane seams, overhang shortened by 72.8 mm, neck deleted). Head-internal geometry in the head_mount frame is unchanged (row at +65.5, film at z -22). Software and firmware still take head geometry from mechanical/common/frames.yaml and the head descriptor, never from literals."
  head_mount:            # centre of the forward bulkhead mating interface (Rev D datum, preserved)
    xyz_mm: [65.7, 0.0, 32.0]      # option C twin-shoe receiver (CCR-11a); Rev D neck was [138.5, 0, 32]
    rpy_rad: [0, 0, 0]
    receiver: "Two 16 x 14 mm head shoes at y = +/-87.5 (lane seams) slide into channels under the chassis front beam; bearing lands at x 8 and 62; x-stop plane x = 65.7; one draw latch under the nose tip; HEAD_DOCK switch behind the left channel. Full definition: mechanical/common/out/mechanical_interfaces.md"
  head_envelope_rev_d_mm: {x: [138.8, 265.0], y: [-175.0, 175.0], z: [7.0, 42.0]}
  head_envelope_rev_e_mm:        # option C position (CCR-11c); shoes extend x [4.0, 66.0] at y +/-87.5, 16 wide, z [16.0, 30.0]
    x: [66.0, 212.5]               # frame ends at 192.2; the sprung leading rail (15.6 mm stroke after trip, IB-11) has its front face at 212.2 unloaded
    y: [-175.0, 175.0]
    z: [5.0, 50.0]               # z min 5.0 covers the 5 mm rail-projection trial; z max is a ceiling, not a target
  head_design_top_z_mm: 45.0     # stack-up in mechanical/common/board_envelopes.yaml (CCR-05)
  body_rev_e:                    # ADOPTED: accepted by Morgan 2026-11-26 (DEC-039), including the bridge grip and aft LiDAR
    status: "adopted; the Rev D body cannot contain the selected hardware (mechanical/common/out/layout_report.md section 3). Tail height to grow for the 12 Ah pack (DEC-040); values below are the 9 Ah layout until mechanical/common is rebuilt"
    scale_of_rev_d_section_law: {length: 1.40, width: 1.30, height: 1.30}
    shell_envelope_mm: {x: [-271.9, 102.4], y: [-146.4, 146.4], z: [32.9, 143.0]}
    overall_mm: [464, 350, 230]     # option C mount + 12 Ah hump (CCR-12): LiDAR top z 230, grip bar top z 175; was [537, 350, 216] with the neck
    battery_hump_mm: {x: [-233.0, -70.5], half_width_y: 60.5, top_z: 150.0, sensor_brow_top_z: 166.0}
    swept_radii_m: {head_outer_corner: 0.275, tail_corner: 0.290}   # head corner at the unloaded rail face (212.2, 175); tail: shell 0.2718, rear bumper centre segment 0.2892 (prototype body, tool-checked on nominal CAD), rounded up; the tail sets the swept circle
    overall_with_sprung_rail_mm: [484, 350, 230]
    track_mm: 270.0
    caster: {swivel_x_mm: -195.0, wheel_x_mm: -204.0}
    top_side: "transverse bridge grip, bar centre x = -30 mm (moved aft from -11 for carry attitude, prototype CR-04; calculated hang about 10 deg tail-down with a head fitted); its saddle is the main-board service cover; LiDAR aft above the battery tunnel"
  optics:
    row_center_x_mm: 131.2         # option C (CCR-11b); Rev D was 204.0
    entrance_film_z_mm: 10.0
    rail_projection_options_mm: [3.0, 5.0]   # below film -> 7 / 5 mm floor clearance
    segment_pitch_mm: 87.5
    active_x_mm: 100.0           # along travel
    active_y_mm: 80.0            # across travel
    segment_center_y_mm: [131.25, 43.75, -43.75, -131.25]   # index 0..3, S0 = robot left
    nominal_seam_mm: 7.5
    outer_margin_mm: 3.75
  map_frame:
    definition: "Fixed to the trailer/container. Origin on the floor at the inside centre of the rear (door) threshold. +x toward the closed front bulkhead, +y left when looking into the trailer from the door, +z up."
  tf_chain: "map -> odom -> base_link -> head_mount -> seg{0..3}_aperture ; base_link -> lidar_link, imu_link, tof_* (values from mechanical/common/frames.yaml)"

# ---------------------------------------------------------------- motion envelope (design values; all pending physical braking/protection trials)
motion:
  survey_speed_mps: 0.10
  max_forward_speed_mps: 0.20
  max_reverse_speed_mps: 0.05
  max_yaw_rate_radps: 0.30          # outer head corner r = 0.275 m -> 0.083 m/s; tail (bumper) r = 0.290 m -> 0.087 m/s
  max_accel_mps2: 0.30
  controlled_decel_mps2: 0.40
  command_ttl_ms_max: 250
  drive_poll_hz: 50
  odom_sample_hz: 100
  stop_model: "d = v*t_delay + v^2/(2*a_min) + m ; design inputs t_delay = 0.15 s, a_min = 0.40 m/s^2, m = 0.020 m (baseline example; replace with measured values)"
  guided_arrival_tolerance_m: 0.010   # provisional, DEC-016
  expose_spot_reverse_offset_m: 0.35

# ---------------------------------------------------------------- acquisition timing
timing:
  head_gate_us_default: 100000
  head_buffer_frames_min: 128
  head_link_baud: 1000000
  head_clock: "64-bit microseconds, monotonic since head MCU boot, derived from the head 24 MHz TCXO"
  chassis_clock: "64-bit microseconds, monotonic since chassis MCU boot"
  host_clock: "CLOCK_MONOTONIC on the CM5 (ROS steady time); ROS stamps use system time derived from it once per boot epoch"
  sync_method: "Host-mediated four-timestamp exchange (TIME op) on both links, linear fit host = offset + drift*device, bound = half round-trip + asymmetry allowance + drift*age."
  max_time_bound_us_for_mapping: 10000
  target_time_bound_us: 2000
  sync_refresh_period_s: 2.0
  sync_expiry_s: 10.0
  head_holdover_rule: "After expiry the head reports HOLDOVER with the bound growing at 200 ppm, and UNSYNCED 60 s after expiry (CR-H5; compile-time constants in firmware/head/core/rrh_config.h)."
  reserved_hw_sync: "J2 pins 5/6 reserved for a future RS-422 hardware time pulse (not fitted in rev A boards; footprints DNP)."

# ---------------------------------------------------------------- power
power:
  battery: {chemistry: LiFePO4, cells_series: 4, nominal_v: 12.8, range_v: [10.0, 14.6], capacity_ah_baseline: 12.0, capacity_ah_trial_0_3: 8.0, baseline_pack: "Power-Sonic PSL-SC-12120, 12 Ah, 151 x 99 x 95/101 mm, 1.65 kg (accepted by Morgan 2026-11-26, DEC-040)", earlier_layout_candidate: "Power-Sonic PSL-SC-1290, 9 Ah, 151 x 65 x 94/99 mm, 1.0 kg (nearest verified catalogue pack, CCR-07); the 12 Ah PSL-SC-12120 needs 34 mm more bay height"}
  rails:
    VBAT_RAW:   {desc: "Pack coupler to board, before main protection"}
    VBAT_SW:    {desc: "After main ideal-diode/eFuse and master switch; feeds all branches"}
    VMOT:       {desc: "Traction supply; exists only while the hardwired safety chain is latched", limit_a: 12.0, as_built_a: 6.5, note: "limit_a is a ceiling; rev A eFuse 6.5 A +-8 %, each bridge chops at 2.68 A"}
    V5_CM5:     {desc: "5.1 V compute rail", limit_a: 5.0}
    V12_LIDAR:  {desc: "Switched VBAT to LiDAR (9-36 V input device)", limit_a: 1.5}
    V3V3_CHS:   {desc: "Chassis logic 3.3 V", limit_a: 1.0}
    HEAD_PWR:   {desc: "J1 pins 1/2. Head electronics supply, VBAT-derived 10-15 V", limit_a: 1.5}
    HEAD_HTR:   {desc: "J1 pins 3/4. Head heater supply, switched by chassis, modulated by head", limit_a: 4.0, as_built_a: 3.96, note: "nominal trip; tolerance band 3.56-4.35 A (stage-2 S2-04), heater draw <= 3.04 A"}
    CHS_HTR:    {desc: "Chassis/battery-bay heater branch", limit_a: 3.0}
    BUS_5V:     {desc: "J2 pin 3/4. 5 V for the bus side of the head's isolated RS-485 transceiver", limit_a: 0.15, protection_max_a: 0.20, note: "0.15 A is the load limit; the branch switch may trip anywhere up to 0.20 A. Rev A current-limit resistor value is UNVERIFIED against the TPS2553 datasheet (IB-28)"}
  head_allocation_w: {electronics_max: 10.0, electronics_target: 5.0, heater_peak_at_12v: 30.0}
  average_budget_w:        # planning values at the pack terminals; electronics lead refines in electronics/analysis/power_budget.md
    drive: 15.0
    compute: 10.0
    lidar: 6.0
    chassis_logic_sensors: 3.0
    head_electronics: 5.0
    heaters_combined: 22.0        # planning value only. Calculated on the common assumption set (IB-39, still air): head 16.9-17.2 W at -20 C and 19.8-20.1 W at -25 C for +10 C at the SiPM carrier (mechanical/head/out/thermal_summary.json); bay 22 W at -20 C and 27 W at -25 C IF the pack skin were held at +10 C (mechanical/common/out/mech_calcs.md section 7). The bay figure is avoided by thermal_policy below.
  thermal_policy:                 # lead decision 2026-11-27 (DEC-045); calculated only, cold trial pending
    bay_discharge: "No regulation to +10 C while running from the pack: heating the pack from its own energy costs more than the capacity it recovers (22 W for about 2 h = 44 Wh against roughly 15 Wh gained on a 154 Wh pack, estimate). The bay heater holds the pack skin at or above bay_min_discharge_c only; typical chassis self-heat (12.6 W) keeps the bay about 11 K above ambient by calculation."
    bay_min_discharge_c: -10.0    # margin to the pack's low-temperature discharge limit (-20 C, recalled from the Power-Sonic PSL-SC data sheet, UNVERIFIED)
    bay_precharge_c: 5.0          # on external power before and during charging (charger gate cold_charge_inhibit_below_c)
    head_setpoint_c: 5.0          # owner decision 2026-11-27 (Morgan): +5 C at the SiPM carrier (was +10 C). Calculated demand, still air, jacket fitted: about 13.8-14.0 W at -20 C and 16.8-17.0 W at -25 C (head report section 9). The optics supplier's temperature limits are still unknown (RFQ).
    head_receiver_thermal_break: "Required: the head heater figures assume about 0.07 W/K per receiver shoe to the body. Metal receiver channels bolted to the chassis plate without a break raise the head demand to 43-66 W (calculated), above the 30 W fitted."
  charger: {topology: "On-board buck charger with power path (LTC4162-F class), external 24 V DC supply", charge_current_a: 3.0, cold_charge_inhibit_below_c: 5.0, note: "The +5 C gate is the on-board charger's thermistor qualification. The baseline pack's own BMS gate is lower (datasheet charge range 0 to +45 C), so it is a backstop, not a second +5 C channel."}

# ---------------------------------------------------------------- hardwired traction chain
safety_chain:
  principle: "Traction energy exists only while a hardware latch is set. The latch is a self-holding relay circuit; any chain element opening drops it. Dropping removes VMOT and connects each motor across a brake resistor through the normally-closed contacts of its DPDT relay (dynamic braking with no power and no firmware). Setting the latch needs every element healthy AND the motion MCU's ARM_PERMIT AND a physical press of the local REARM button. Not a certified safety function; see risks register."
  series_elements:           # order in the chain; names are used verbatim in schematics, firmware and UI
    - {id: MODE_RUN,      desc: "Master switch in RUN (not OFF/SERVICE)"}
    - {id: ESTOP,         desc: "Latching mushroom, positive-opening NC, two poles (high side and low side of the latch coil)"}
    - {id: HANDS_ON,      desc: "Maintained local HANDS-ON INHIBIT pushbutton, NC, illuminated from the actual chain state"}
    - {id: CHG_COVER,     desc: "Charge inlet cover switch closed (cover shut) AND charge plug link absent"}
    - {id: HEAD_DOCK,     desc: "Body-side dock switch: head (or dummy head) mechanically seated and latched"}
    - {id: HEAD_LOOP,     desc: "J1 pins 5/6 loop through three head rail switches + 1.00 kOhm; two independent window-comparator channels in series in the chain (stage 3, after the traction-inhibit review), 0.6-1.6 kOhm = healthy; open = contact or unplugged; short = wiring fault. Both channels share the loop sense node: a 1-3 kOhm leak from that node to a supply defeats both (stated limit)."}
    - {id: LAB_KEY_N,     desc: "J1 pin 7 PRES_ID shows a head without the LAB extension resistor"}
    - {id: BODY_BUMPER,   desc: "Rear/quarter body bumper NC switches"}
    - {id: WDG_OK,        desc: "External window watchdog serviced by the motion MCU"}
    - {id: ARM_PERMIT,    desc: "Motion MCU output; low at reset; firmware-level permissives"}
  rearm: "Local REARM/Start pushbutton only (momentary NO in the latch set path). No network path can set the hardware latch."
  software_latch: "PROTECTIVE_STOP in the motion MCU (field intrusion, cliff, stale sensor, command timeout...). Cleared only by an explicit REARM_SW command from the controlling operator session or the local REARM button, with the cause cleared. Never auto-clears."

# ---------------------------------------------------------------- enumerations shared by firmware, ROS and UI
enums:
  chassis_mode: [BOOT, SERVICE_CHARGE, LAB, STANDBY, ARMED_IDLE, MOVING, HOLD, PROTECTIVE_STOP, HW_INHIBIT, FAULT]
  hw_inhibit_reason: [MODE_NOT_RUN, ESTOP, HANDS_ON, CHARGER, HEAD_UNDOCKED, HEAD_LOOP_OPEN, HEAD_LOOP_SHORT, J1_ABSENT, LAB_KEY, BODY_BUMPER, WATCHDOG, MCU_NOT_READY, VMOT_FAULT, LATCH_UNEXPLAINED]
  protective_stop_reason: [FIELD_FRONT, FIELD_REAR, FIELD_LEFT, FIELD_RIGHT, CLIFF_FL, CLIFF_FR, CLIFF_RL, CLIFF_RR, LOOKAHEAD_L, LOOKAHEAD_R, TOF_STALE, TOF_DISAGREE, CMD_TIMEOUT, HOST_LINK_LOST, STALL, ENCODER_FAULT, IMU_FAULT, TILT, BATTERY_LOW, TEMP_RANGE, HOST_REQUEST, HEAD_LINK, LOCALIZATION, BRAKE_TEST_FAIL, STOP_ESCALATED]
  op_mode: [COMMISSIONING, SURVEY_SHARED, SURVEY_UNATTENDED, GUIDED, LAB, SERVICE]
  head_presence: [ABSENT, HEAD_DIRECT, HEAD_VIA_LAB_EXTENSION, LAB_EXTENSION_ONLY, FAULT]
  evidence_class: [calculated, simulated, tool-checked, physically-measured, pending]

# ---------------------------------------------------------------- boards (provisional envelopes; mechanical lead confirms fit, electronics leads confirm area)
boards:
  RR-HEAD-ACQ:
    desc: "Head acquisition board: 8 SiPM front ends, bias, thresholds, discriminators with event latches, head MCU (STM32G474VET6, LQFP100), isolated RS-485, heater switch, power. No FPGA (DEC-037)."
    outline_mm: [326.0, 96.0]
    layers: 4
    position: "Above the reference guides, long axis along y. Board frame: origin at the rear-left corner, +u toward robot right (-y), +v forward (+x). Origin in base_link (83.2, 163.0, 34.5) mm with mount option C (CCR-11d; was 156.0 with the neck); PCB underside z = 34.5 (CCR-04)."
    mounting: "8 x M2.5; coordinates, connector edge allocation and height zones in mechanical/common/board_envelopes.yaml (authoritative)"
    max_height_top_mm: 6.0
    max_height_bottom_mm: 2.0
  RR-CHS-MAIN:
    desc: "Chassis main board: pack input, charger/power path, branch protection, 5 V compute rail, safety chain and brake relays, motion MCU, dual H-bridge, sensor and panel I/O, host-side RS-485 and USB"
    outline_mm: [160.0, 100.0]
    layers: 4
    position: "Flat on a bridge over the motors under the grip saddle; origin in base_link (-67.0, 80.0, 83.0) mm in the Rev E body proposal (CCR-06). Fits only the Rev E body proposal, not the Rev D body."
    mounting: "6 x M3; coordinates, connector edge allocation and height zones in mechanical/common/board_envelopes.yaml (authoritative)"
    max_height_top_mm: 18.0
    max_height_bottom_mm: 3.0
  RR-TOF:
    desc: "VL53L4ED carrier, 11 per robot (4 cliff; 4 oblique look sensors: LOOK_FL/LOOK_FR forward over the head from the grip cheeks, LOOK_RL/LOOK_RR rearward from the tail; 3 rear proximity)"
    outline_mm: [18.0, 14.0]
    layers: 2
  RR-PANEL:
    desc: "Operator annunciator board: 5 status LEDs with light pipes, buzzer, button/LED harness landing"
    outline_mm: [70.0, 24.0]
    layers: 2

# ---------------------------------------------------------------- system connectors (functions and pin order are frozen here; MPNs live in harness/connectors.yaml)
connectors:
  J1:
    name: "HEAD POWER / INTERLOCK"
    family: "M16 circular, 8-pole, IEC 61076-2-106, screw locking, IP67 mated, shielded"
    chassis_side: "panel socket, female contacts (touch-safe source)"
    head_side: "cable plug, male contacts, on a captive pigtail from the head"
    rating_per_contact_a: 5.0
    pins:
      1: {net: HEAD_PWR_P,  desc: "Head electronics supply +, 10-15 V, 1.5 A limit", awg: 20}
      2: {net: HEAD_PWR_N,  desc: "Head electronics return (the only DC ground connection between head and chassis)", awg: 20}
      3: {net: HEAD_HTR_P,  desc: "Head heater supply +, 4 A limit", awg: 18}
      4: {net: HEAD_HTR_N,  desc: "Head heater return (kept out of the electronics return)", awg: 18}
      5: {net: HEAD_LOOP_OUT, desc: "Interlock loop source (potential-free pair)", awg: 24}
      6: {net: HEAD_LOOP_RET, desc: "Interlock loop return", awg: 24}
      7: {net: HEAD_PRES_ID, desc: "4.70 kOhm 1% to pin 2 inside the head; the LAB extension adds 1.50 kOhm 1% to pin 2 at its chassis-end plug", awg: 24}
      8: {net: NC_RESERVED, desc: "Reserved, not connected"}
    shell: "Cable shield. Bonded to chassis at the receptacle; at the head, to head frame through 1 MOhm || 10 nF."
  J2:
    name: "HEAD DATA"
    family: "M12 A-coded, 8-pole, IEC 61076-2-101, screw locking, IP67 mated, shielded"
    chassis_side: "panel socket, female contacts"
    head_side: "cable plug, male contacts, on a captive pigtail from the head"
    pins:
      1: {net: RS485_DP,  desc: "RS-485 non-inverting line (positive with respect to DN in the idle/mark state)", pair: 1}
      2: {net: RS485_DN,  desc: "RS-485 inverting line", pair: 1}
      3: {net: BUS_5V,    desc: "5 V from chassis for the bus side of the head's isolated transceiver", pair: 2}
      4: {net: BUS_GND,   desc: "Bus reference = chassis logic ground. Galvanically isolated from head ground inside the head.", pair: 2}
      5: {net: SYNC_P,    desc: "Reserved hardware time pulse +", pair: 3}
      6: {net: SYNC_N,    desc: "Reserved hardware time pulse -", pair: 3}
      7: {net: J2_PRES,   desc: "Linked to pin 4 inside the head plug; lets the chassis latch J2 mate/unmate events", pair: 4}
      8: {net: NC_RESERVED, desc: "Reserved, not connected", pair: 4}
    shell: "Cable shield, same bonding rule as J1."
    termination: "120 Ohm at each end (chassis board and head board). Fail-safe bias at the chassis end only."
  lab_extension:
    desc: "2 m LAB ONLY extension pair: J1X (M16 8-pole plug to socket) and J2X (M12 A-coded 8-pole plug to socket), straight through, plus the 1.50 kOhm LAB resistor from pin 7 to pin 2 in the J1X chassis-end plug backshell."
    presence_decode_on_pin7_to_pin2_ohm: {ABSENT: ">20k", HEAD_DIRECT: "4.70k (3.9k-5.6k window)", HEAD_VIA_LAB_EXTENSION: "1.137k (0.95k-1.33k window)", LAB_EXTENSION_ONLY: "1.50k (1.33k-1.8k window)", FAULT: "<0.8k or between windows"}

# ---------------------------------------------------------------- head acquisition source (HAL boundary between head firmware core, FPGA driver and the emulator)
head_gate_record:
  desc: "One record per gate from the event-capture module (MCU timers + discrete latches, see head_event_capture) to the head firmware core. The firmware core turns it into an ACQ 2.0 frame; the emulator fabricates the same record from Poisson draws."
  per_lane_fields:
    alpha_counts:  "Events classified alpha-like (slow-path above ALPHA threshold)"
    beta_counts:   "Events in the beta window (fast-path above BETA_LLD, below BETA_ULD, slow-path below ALPHA)"
    floor_reject_counts: "Floor events above BETA_ULD without ALPHA (overrange/Cherenkov-like); engineering field"
    floor_live_ticks: "Clock ticks during which the floor channel logic was able to accept an event"
    ref_counts:    "Reference events above REF_LLD and below REF_ULD"
    ref_reject_counts: "Reference events above REF_ULD; engineering field"
    ref_live_ticks: "Live ticks of the reference channel"
    flags:         "FLOOR_SATURATED, REF_SATURATED, BIAS_OUT_OF_RANGE, BASELINE_SHIFT, FLOOR_INVALID, REF_INVALID (CR-H1). Mapping to ACQ 2.0 lane flags is frozen in interface/head_icd_addendum_0.4.md section 2 (CR-H2): BASELINE_SHIFT -> DISCRIMINATOR_FAULT with all three channels null; lane BIAS_OUT_OF_RANGE -> FLOOR_FAULT + REFERENCE_FAULT; live fraction below 50 % -> SATURATED; *_INVALID -> FLOOR_FAULT / REFERENCE_FAULT + null."
    width_histogram: "Optional engineering extension (CR-H8): per-chain time-over-threshold histogram, 4 bins, with a width_mask naming the chains that provide it; carried only in DIAG."
  common_fields: [sequence, gate_start_tick, gate_ticks, tick_hz, heater_on_ticks, heater_transition_in_gate]
  acq_mapping: "segments[n].alpha = {alpha_counts, floor_live_us}; beta_window = {beta_counts, floor_live_us}; photon_ref = {ref_counts, ref_live_us}; lane flags map onto the existing ACQ 2.0 enum (SATURATED, FLOOR_FAULT, REFERENCE_FAULT, DEAD_TIME_UNKNOWN, DISCRIMINATOR_FAULT). ACQ 2.0 is strict (additionalProperties false) and stays byte-compatible: reject counters, per-gate heater-transition markers and other engineering values are fetched with a separate, additive DIAG op (heads without it answer UNSUPPORTED) and archived beside the raw frames."

# ---------------------------------------------------------------- chassis link (host <-> motion MCU), protocol "RR-CHS 1.0"
chassis_link:
  transport: "USB 2.0 FS CDC-ACM from the motion MCU to the CM5. Same record framing as head ICD section 4: one UTF-8 JSON object, TAB, 8 uppercase hex CRC-32 (zlib) of the JSON bytes, LF. Max record 4096 bytes (raised from 2048 because a full STATE reply is about 1.8 kB before fault lists; chassis CR 1). Host polls; one transaction outstanding; a retry with the same id and identical bytes returns the cached reply. HELLO opens the session and is required before any other op except TIME; a new HELLO while moving latches HOST_LINK_LOST. No request for 1 s while armed latches HOST_LINK_LOST."
  authoritative_text: "interface/chassis_icd.md and interface/chassis_link.schema.json (owner: chassis firmware). The op summaries below are the original contract table; additive members accepted on 2026-11-26: op DIAG; DRIVE request issued_us and reply stationary {is_stationary, since_us}, applied, motion, allow, v_cap_mps, hold, rearm_nonce; STOP optional reason so the host can assert FIELD_FRONT/LEFT/RIGHT/REAR, HEAD_LINK, LOCALIZATION; REARM_SW nonce is chassis-issued (rearm_nonce). Per-op_mode speed caps in ICD 6.1 are provisional pending braking and personnel-protection trials. Motion requires a passed BRAKE_TEST since boot. Head branch power is forced off at every MCU boot."
  envelope: {request: '{"type":"REQ","v":"1.0","id":<u32>,"op":<str>,"args":{...}}', response: '{"type":"RSP","v":"1.0","id":<u32>,"status":<str>,"body":{...}}'}
  status: [OK, BAD_ARG, UNSUPPORTED, REJECTED, BUSY, FAULT]
  ops:
    HELLO:    "{} -> fw, hw_rev, serial, boot_id (fresh UUID each boot), proto, caps {encoder_cpr, wheel_radius_nom_m, track_nom_m, max_v_mps, max_w_radps}"
    TIME:     "{} -> rx_us, tx_us on the chassis clock (same exchange as the head TIME op)"
    DRIVE:    "{seq, v_mps, w_radps, ttl_ms<=250, op_mode} -> accepted(bool), reject_reason, mode, odom {t_us, left_ticks, right_ticks (signed 64-bit cumulative), left_tps, right_tps}, imu {t_us, gyro_rps[3], accel_mps2[3]}, stops {hw:[...], sw:[...]}, event_seq (newest event number). Cyclic at 50 Hz. A DRIVE older than its ttl, out of order, or received while inhibited is rejected, never queued. v = w = 0 is a valid keep-alive."
    STATE:    "{} -> mode, op_mode, hw_latch, chain {element: bool for every safety_chain id}, hw_inhibit_reasons[], protective_stop_reasons[], head_presence, j2_present, rails {vbat_v, vmot_v, ibat_a, i_drive_a[2], i_head_a, i_head_htr_a, i_chs_htr_a, v5_v}, battery {soc_pct, temp_c[2], charge_state}, temps {board_c, bay_c}, tof [{id, range_mm, status, age_ms}], bumpers {...}, panel {buttons, leds}, heater {chassis_duty_pct}, faults[]"
    EVENTS:   "{after_seq} -> list of latched events {seq, t_us, kind, detail}. Every chain-element transition, presence transition on J1/J2, button press, mode change, brownout and reset cause is latched here independently of polling."
    REARM_SW: "{nonce, operator} -> clears the software PROTECTIVE_STOP latch if causes are clear. Cannot set the hardware latch."
    STOP:     "{kind: CONTROLLED|PROTECTIVE} -> controlled ramp to zero, or software protective stop latch"
    SET_OP_MODE: "{op_mode} -> selects the speed/field profile enforced locally. Rejected unless stationary."
    HEAD_POWER: "{electronics: bool, heater_enable: bool} -> switches the J1 branches. Forced off in SERVICE_CHARGE."
    HEATER:   "{chassis_setpoint_c} -> chassis/battery bay heater regulation setpoint"
    PANEL:    "{pattern} -> annunciator/buzzer pattern request (the MCU overrides for safety states)"
    CONFIG_GET: "{key} -> value ; CONFIG_SET {key, value} persists calibration (wheel radius, track, field distances, speed caps) with CRC; changes are logged as events"
    BRAKE_TEST: "{} -> runs the stationary brake-relay and VMOT-drop self-test; result in body"

# ---------------------------------------------------------------- head event capture without an FPGA (DEC-037)
head_event_capture:
  rationale: "Expected rates are a few to ~2000 events/s per chain (radiometry study, assumed responses). At 10-20 us per event the dead fraction is <= 4 %, and it is measured, so programmable logic adds a toolchain and a second firmware artefact without a measurable benefit. Revisit only if measured rates exceed ~2e4 /s per chain or digital pulse-shape discrimination is adopted."
  per_floor_chain_hardware: "3 comparators (BETA_LLD, BETA_ULD fast path; ALPHA slow path) -> 3 edge-triggered D latches. The BETA_LLD latch is BUSY: once set, further LLD edges do nothing until the MCU clears it (non-retriggerable by construction)."
  per_ref_chain_hardware: "2 comparators (REF_LLD, REF_ULD) -> 2 latches; REF_LLD latch is BUSY."
  mcu: "STM32G474VET6. BUSY of the 8 chains -> 8 input-capture channels of the two 32-bit timers (TIM2, TIM5) running from the 24 MHz TCXO-derived clock: the event start time is captured in hardware. A fixed-rate service interrupt (default 100 kHz) classifies every chain whose BUSY has been set for at least the acceptance window W (default 4 us) and whose LLD comparator has returned low (bounded by a maximum hold after which the chain is flagged saturated): reads the ULD/ALPHA latches, increments the class counter, reads the timer for the clear time, pulses CLR. CPU load is independent of count rate."
  classification: "floor: ALPHA latched -> alpha; else ULD latched -> floor reject; else -> beta window. reference: ULD latched -> ref reject; else -> ref count."
  live_time: "Per chain and gate: live = gate span - sum over events of (clear time - captured start time), with busy intervals split exactly at gate boundaries. Both ends are timer readings; nothing is inferred from wall time or from a nominal dead time."
  gates: "The service interrupt that follows the gate boundary (within 10 us) snapshots all counters atomically and splits busy intervals arithmetically at the exact boundary tick (CR-H3). An event is attributed to the gate in which it is classified."
  tick: "TIM2/TIM5 at 144 MHz (144 ticks per microsecond). A chain whose comparator is high while its latch is clear is treated as saturated. Dead time is about 9.7 us per event in the host simulation of the capture logic (simulated, CR-H4)."
  pulse_width: "Raw LLD comparator outputs on TIM4 (floor) and TIM3 (reference) capture channels for time-over-threshold (CR-H8)."
  test: "Charge-injection pulser strobed by an MCU timer output (periodic and pseudo-random) for counting, live-time and rate-sweep validation; a firmware self-test drives the latch clocks through a test line with no analog signal."

# ---------------------------------------------------------------- survey methods (DEC-038); selected per mission from the site profile
survey_methods:
  terms: "Ratemeter = sliding-window count rate evaluated every gate while moving (window default = aperture transit time L/v). Scaler count = counts and live time accumulated with the robot verified stationary for a preset live time, or adaptively until a decision is reached (D# <= goal, or net result clear of the decision threshold) up to a maximum time."
  SEARCH_THEN_COUNT:
    desc: "Ratemeter search at survey speed for hot spots, then park the flagged lane over the spot and take a scaler count. The search alarm is deliberately sensitive; the scaler count makes the reported decision."
    params: {search_speed_mps: 0.10, ratemeter_window_s: 1.0, count_policy: [INLINE, DEFERRED], scaler_mode: [PRESET_TIME, ADAPTIVE], scaler_preset_s: 30, scaler_max_s: 100}
    notes: "INLINE stops at once, reverses to centre the alarming lane on the peak and counts. DEFERRED queues the spots and visits them after the pass or after the scan (same motion as a guided revisit). Floor that only saw the search stage is reported at the search-stage detection limit."
  STEP_AND_COUNT:
    desc: "Scaler survey of the whole floor: move one station, stop, count, repeat. Every credited measurement is a static count over four defined 80 cm2 apertures."
    params: {station_pitch_m: 0.080, settle_s: 0.5, scaler_mode: [PRESET_TIME, ADAPTIVE], scaler_preset_s: 10, scaler_max_s: 60}
    notes: "Station pitch is the aperture length (0.100 m) less twice the position-erosion allowance (2 x 10 mm), so credited footprints of successive stations abut (robot software CR-05). Counts taken while moving between stations are archived and shown as ratemeter data but earn no coverage credit. Mission time is hours for a full trailer (see architecture document); expect pack swaps."
  CONTINUOUS_SCAN:
    desc: "Constant-speed scan with no stops; speed chosen so the aperture dwell meets the detection goal."
    params: {speed_mps: [0.02, 0.20]}
  review_queue_policy:
    desc: "What enters the review queue (owner decision 2026-11-27). A site-profile setting."
    options:
      ALARM_ONLY: "Default. Only cells whose statistic exceeds the decision threshold at the profile's scan-stage false-alarm rate (alpha_scan) are queued (and, in SEARCH_THEN_COUNT, trigger the scaler count). Cells that do not alarm but whose detection limit is above the profile's detection goal are shown on the map as 'sensitivity insufficient' and counted in the residual area; they are not queued."
      ALL_UNRESOLVED: "Every cell that cannot be cleared at the investigation level is queued (the behaviour before this decision)."
    default: ALARM_ONLY
  common: "All methods record raw gates identically; the method, its parameters and the stage that produced each cell's decision are stored with the result. A scaler count is valid only while both wheel encoders and the gyro confirm zero motion and no stop/inhibit transition occurred inside it."
